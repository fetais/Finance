<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#F7F7F4">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Finance V2">
<link rel="manifest" href="data:application/manifest+json,%7B%22name%22%3A%22Finance%20V2%22%2C%22short_name%22%3A%22Finance%22%2C%22start_url%22%3A%22.%2F%22%2C%22display%22%3A%22standalone%22%2C%22orientation%22%3A%22portrait%22%2C%22background_color%22%3A%22%23F7F7F4%22%2C%22theme_color%22%3A%22%230F5C56%22%7D">
<title>Finance V2 — Personal Finance Planner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F7F7F4;--surface:#FFFFFF;--ink:#111512;--muted:#6F756F;--soft:#ECEDE8;--line:#E1E3DD;
  --teal:#0F5C56;--teal-2:#DDEBE8;--teal-3:#F0F7F5;--amber:#A8680B;--amber-bg:#FFF4DE;
  --red:#B73A32;--red-bg:#FDECEA;--green:#2F745D;--blue:#3B6E94;--purple:#756B9C;
  --radius:18px;--shadow:0 12px 32px rgba(17,21,18,.08);
  --font:'Space Grotesk','Cairo',system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;background:#E9EAE5}
body{margin:0;background:#E9EAE5;color:var(--ink);font-family:var(--font);display:flex;justify-content:center;min-height:100vh}
button,input,select,textarea{font:inherit}
button{color:inherit}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid rgba(15,92,86,.24);outline-offset:2px}
button,[role="button"]{min-height:44px}
button{cursor:pointer}
[hidden]{display:none!important}
.app{width:100%;max-width:430px;min-height:100vh;background:var(--bg);position:relative;padding-bottom:104px;overflow-x:hidden}
.app-header{position:sticky;top:0;z-index:25;background:rgba(247,247,244,.93);backdrop-filter:blur(18px);border-bottom:1px solid rgba(225,227,221,.72);padding:calc(13px + env(safe-area-inset-top)) 16px 11px}
.header-row{display:flex;align-items:center;gap:10px}
.identity{flex:1;min-width:0}
.greeting{font-size:17px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.period-sub{font-size:12px;color:var(--muted);margin-top:2px}
.header-actions{display:flex;align-items:center;gap:7px}
.icon-btn,.period-btn,.lang-btn{border:1px solid var(--line);background:var(--surface);border-radius:14px;display:inline-flex;align-items:center;justify-content:center}
.icon-btn{width:44px;padding:0}
.period-btn{padding:0 12px;font-size:12px;font-weight:700;gap:6px;white-space:nowrap}
.lang-btn{padding:0 10px;font-size:12px;font-weight:700}
.sample-strip{display:flex;align-items:center;justify-content:center;gap:7px;background:#FFF5D9;color:#785106;border-bottom:1px solid #EFDDA9;font-size:12px;font-weight:700;padding:7px 14px}
.dot{width:7px;height:7px;border-radius:50%;background:currentColor;display:inline-block}
main{padding:15px 16px 24px}
.view{display:none}.view.active{display:block}
.view-title{font-size:24px;line-height:1.2;margin:2px 0 4px;font-weight:700;letter-spacing:-.025em}
.view-subtitle{font-size:12px;line-height:1.55;color:var(--muted);margin:0 0 14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin-top:13px}
.card:first-child{margin-top:0}
.hero{background:var(--ink);color:#fff;border:none;padding:21px;border-radius:18px;position:relative;overflow:hidden}
.hero:after{content:"";position:absolute;width:210px;height:210px;border-radius:50%;right:-95px;top:-105px;background:radial-gradient(circle,rgba(255,255,255,.15),transparent 68%);pointer-events:none}
[dir="rtl"] .hero:after{right:auto;left:-95px}
.hero>*{position:relative;z-index:1}
.hero-label{font-size:12px;font-weight:700;opacity:.62;letter-spacing:.08em;text-transform:uppercase}
[dir="rtl"] .hero-label{text-transform:none;letter-spacing:0;font-size:12px}
.hero-value{font-size:52px;line-height:1.08;font-weight:700;letter-spacing:-.045em;margin-top:7px;font-variant-numeric:tabular-nums}
.hero-value.negative{color:#FFB9B3}
.currency{font-size:12px;font-weight:700;opacity:.58;margin-inline-start:6px;letter-spacing:0}
.hero-desc{font-size:12px;line-height:1.55;opacity:.62;margin-top:8px;max-width:330px}
.hero-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px 16px;border-top:1px solid rgba(255,255,255,.15);margin-top:17px;padding-top:15px}
.hero-metric-label{font-size:10px;opacity:.56;margin-bottom:4px}
.hero-metric-value{font-size:17px;font-weight:700;font-variant-numeric:tabular-nums}
.hero-link{border:0;background:transparent;color:#fff;padding:7px 0 0;min-height:auto;font-size:12px;font-weight:700;text-decoration:underline;text-underline-offset:3px}
.section-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:11px}
.section-title{font-size:14px;font-weight:700;margin:0}
.section-link{border:0;background:transparent;color:var(--teal);min-height:auto;padding:3px 0;font-size:12px;font-weight:700}
.muted{color:var(--muted)}
.small{font-size:12px;line-height:1.55}
.metric-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.metric{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px}
.metric-label{font-size:12px;color:var(--muted);line-height:1.35}
.metric-value{font-size:24px;font-weight:700;margin-top:5px;font-variant-numeric:tabular-nums;letter-spacing:-.025em}
.metric-note{font-size:10px;color:var(--muted);margin-top:3px}
.attention-list,.list{display:flex;flex-direction:column}
.attention{display:flex;gap:11px;padding:12px 0;border-bottom:1px solid var(--line);align-items:flex-start}
.attention:last-child{border-bottom:0;padding-bottom:2px}
.status-icon{width:35px;height:35px;flex:none;border-radius:14px;display:flex;align-items:center;justify-content:center}
.status-icon.warn{background:var(--amber-bg);color:var(--amber)}
.status-icon.danger{background:var(--red-bg);color:var(--red)}
.status-icon.good{background:var(--teal-3);color:var(--teal)}
.attention-main{flex:1;min-width:0}
.attention-title{font-size:12px;font-weight:700;line-height:1.4}
.attention-desc{font-size:12px;color:var(--muted);line-height:1.5;margin-top:2px}
.attention-action{border:0;background:transparent;color:var(--teal);font-size:12px;font-weight:700;min-height:auto;padding:4px 0}
.row{display:flex;align-items:center;gap:11px;padding:12px 0;border-bottom:1px solid var(--line);width:100%;background:transparent;border-left:0;border-right:0;border-top:0;text-align:start}
.row:last-child{border-bottom:0}
.row-icon{width:39px;height:39px;border-radius:14px;display:flex;align-items:center;justify-content:center;flex:none;background:var(--soft)}
.row-main{flex:1;min-width:0}
.row-title{display:block;font-size:14px;font-weight:700;line-height:1.35;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row-sub{display:block;font-size:10px;color:var(--muted);line-height:1.45;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row-side{text-align:end;flex:none;max-width:128px;white-space:nowrap}
.row-amount{display:block;font-size:14px;font-weight:700;font-variant-numeric:tabular-nums}
.row-amount.positive{color:var(--teal)}
.row-amount.negative{color:var(--red)}
.row-tag{display:block;font-size:10px;color:var(--muted);margin-top:3px}
.chev{color:#9A9F99;width:18px;height:18px;flex:none}
.quick-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.quick{border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:10px 5px 9px;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:7px;min-width:0}
.quick-ic{width:34px;height:34px;border-radius:14px;display:flex;align-items:center;justify-content:center}
.quick-name{font-size:10px;font-weight:700;line-height:1.25;text-align:center;width:100%;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.progress-track{height:8px;background:var(--soft);border-radius:99.0px;overflow:hidden;position:relative}
.progress-fill{height:100%;border-radius:99.0px;background:var(--teal);display:block}
.progress-fill.warn{background:var(--amber)}
.progress-fill.danger{background:var(--red)}
.progress-row{margin:13px 0}
.progress-top{display:flex;justify-content:space-between;gap:10px;margin-bottom:7px;align-items:baseline}
.progress-name{font-size:12px;font-weight:700}
.progress-values{font-size:10px;color:var(--muted);font-variant-numeric:tabular-nums}
.progress-note{display:flex;justify-content:space-between;gap:8px;font-size:10px;color:var(--muted);margin-top:6px}
.segmented{display:flex;background:#E9EAE5;border-radius:14px;padding:4px;gap:2px;margin-bottom:13px}
.segmented button{flex:1;border:0;background:transparent;border-radius:14px;font-size:12px;font-weight:700;color:var(--muted);padding:0 7px}
.segmented button.active{background:var(--surface);color:var(--ink);box-shadow:0 1px 4px rgba(17,21,18,.08)}
.primary,.secondary,.danger-btn,.ghost-btn{width:100%;border-radius:14px;border:0;padding:0 15px;font-weight:700;font-size:14px;display:flex;align-items:center;justify-content:center;gap:8px}
.primary{background:var(--teal);color:#fff}
.secondary{background:var(--teal-2);color:var(--teal)}
.danger-btn{background:var(--red-bg);color:var(--red)}
.ghost-btn{background:var(--surface);border:1px solid var(--line)}
.btn-row{display:flex;gap:9px;margin-top:14px}.btn-row>*{flex:1}
.badge{display:inline-flex;align-items:center;gap:5px;border-radius:99.0px;padding:5px 9px;font-size:10px;font-weight:700;background:var(--soft);color:var(--muted)}
.badge.warn{background:var(--amber-bg);color:var(--amber)}
.badge.danger{background:var(--red-bg);color:var(--red)}
.badge.good{background:var(--teal-3);color:var(--teal)}
.empty{text-align:center;padding:27px 18px}
.empty-icon{width:66px;height:66px;border-radius:18px;background:var(--teal-3);color:var(--teal);display:flex;align-items:center;justify-content:center;margin:0 auto 15px}
.empty-title{font-size:17px;font-weight:700;margin:0}
.empty-desc{font-size:12px;color:var(--muted);line-height:1.6;margin:7px auto 0;max-width:280px}
.bottom-nav{position:fixed;z-index:30;bottom:0;width:100%;max-width:430px;background:rgba(255,255,255,.95);backdrop-filter:blur(18px);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);align-items:end;padding:8px 6px calc(10px + env(safe-area-inset-bottom))}
.nav-btn{border:0;background:transparent;color:var(--muted);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:10px;font-weight:700;padding:3px 2px}
.nav-btn svg{width:22px;height:22px}.nav-btn.active{color:var(--teal)}
.fab-wrap{display:flex;justify-content:center;align-items:flex-end}
.fab{width:52px;height:52px;border-radius:18px;border:0;background:var(--ink);color:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 10px 22px rgba(17,21,18,.2);transform:translateY(-8px)}
.fab svg{width:24px;height:24px}
.overlay{position:fixed;inset:0;z-index:80;display:none;align-items:flex-end;justify-content:center;background:rgba(17,21,18,.43);backdrop-filter:blur(3px)}
.overlay.open{display:flex}
.sheet{width:100%;max-width:430px;max-height:89vh;background:var(--surface);border-radius:18px 25px 0 0;overflow:hidden;display:flex;flex-direction:column;box-shadow:var(--shadow)}
.sheet-head{display:flex;align-items:center;gap:10px;padding:10px 18px 11px;border-bottom:1px solid var(--line)}
.grab{position:absolute;left:50%;transform:translateX(-50%);width:38px;height:4px;background:#D9DDD6;border-radius:99.0px;margin-top:-2px}
.sheet-title{font-size:17px;font-weight:700;flex:1;margin-top:8px}
.close-btn{border:0;background:var(--soft);width:40px;height:40px;border-radius:14px;display:flex;align-items:center;justify-content:center;margin-top:5px}
.sheet-body{overflow-y:auto;padding:17px 18px calc(24px + env(safe-area-inset-bottom))}
.full-overlay{position:fixed;inset:0;z-index:90;background:var(--bg);display:none;max-width:430px;margin:0 auto;flex-direction:column}
.full-overlay.open{display:flex}
.full-head{display:flex;align-items:center;gap:10px;padding:calc(14px + env(safe-area-inset-top)) 16px 10px;border-bottom:1px solid var(--line);background:rgba(247,247,244,.96)}
.full-title{font-size:17px;font-weight:700;flex:1}
.full-body{flex:1;overflow-y:auto;padding:16px 16px 28px}
.field{margin-top:13px}
.field:first-child{margin-top:0}
label,.field-label{display:block;font-size:12px;font-weight:700;margin-bottom:6px;color:#3D443E}
input,select,textarea{width:100%;border:1.5px solid var(--line);background:var(--surface);border-radius:14px;padding:12px 13px;color:var(--ink);font-size:17px;min-height:46px}
textarea{min-height:86px;resize:vertical;line-height:1.5}
input:focus,select:focus,textarea:focus{border-color:var(--teal)}
.input-row{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.amount-input{font-size:34px;font-weight:700;text-align:center;letter-spacing:-.035em;padding:17px 10px;direction:ltr}
.help{font-size:10px;color:var(--muted);line-height:1.5;margin-top:6px}
.check-row{display:flex;align-items:flex-start;gap:9px;border:1px solid var(--line);border-radius:14px;padding:12px;margin-top:12px}
.check-row input{width:20px;height:20px;min-height:0;flex:none;margin-top:1px}
.check-copy{font-size:12px;line-height:1.45}.check-copy b{display:block;font-size:12px;margin-bottom:2px}
.chip-row{display:flex;gap:7px;overflow-x:auto;padding:2px 0 4px;scrollbar-width:none}.chip-row::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:99.0px;padding:0 12px;font-size:12px;font-weight:700;display:inline-flex;align-items:center;gap:6px;min-height:39px}
.chip.active{border-color:var(--teal);color:var(--teal);background:var(--teal-3)}
.form-actions{display:flex;gap:9px;margin-top:18px}.form-actions>*{flex:1}
.toast{position:fixed;z-index:120;bottom:calc(92px + env(safe-area-inset-bottom));left:50%;transform:translate(-50%,18px);width:calc(100% - 32px);max-width:398px;background:var(--ink);color:#fff;border-radius:14px;padding:12px 14px;display:flex;align-items:center;gap:10px;opacity:0;pointer-events:none;transition:.25s}
.toast.show{opacity:1;transform:translate(-50%,0);pointer-events:auto}
.toast-msg{font-size:12px;line-height:1.4;flex:1}.toast button{border:0;background:transparent;color:#C8F169;font-size:12px;font-weight:700;min-height:auto;padding:4px}
.chart{height:132px;display:flex;align-items:flex-end;gap:3px;border-bottom:1px solid var(--line);padding-top:9px}
.bar{flex:1;min-width:3px;border-radius:6px 4px 0 0;background:var(--teal);height:2px;position:relative}
.bar.weekend{background:#B9812E}.bar.zero{background:#E7E9E4;height:3px!important}
.chart-axis{display:flex;justify-content:space-between;color:var(--muted);font-size:10px;margin-top:6px}
.insight-card{border-inline-start:4px solid var(--teal);padding-inline-start:14px}
.insight-card.warn{border-inline-start-color:var(--amber)}.insight-card.danger{border-inline-start-color:var(--red)}
.insight-title{font-size:14px;font-weight:700;line-height:1.45}.insight-body{font-size:12px;color:var(--muted);line-height:1.6;margin-top:5px}
.insight-rec{font-size:12px;line-height:1.55;margin-top:8px;background:var(--soft);border-radius:14px;padding:9px 10px}
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.kv{display:flex;justify-content:space-between;gap:12px;padding:11px 0;border-bottom:1px solid var(--line);font-size:12px}.kv:last-child{border-bottom:0}.kv span:last-child{font-weight:700;text-align:end;font-variant-numeric:tabular-nums}
.notice{border-radius:14px;padding:11px 12px;background:var(--teal-3);color:#244A45;font-size:12px;line-height:1.55}.notice.warn{background:var(--amber-bg);color:#744C05}.notice.danger{background:var(--red-bg);color:#7C2721}
.divider{height:1px;background:var(--line);margin:15px 0}
.settings-row{display:flex;align-items:center;gap:11px;padding:13px 0;border-bottom:1px solid var(--line);width:100%;border-top:0;border-left:0;border-right:0;background:transparent;text-align:start}.settings-row:last-child{border-bottom:0}
.settings-copy{flex:1;min-width:0}.settings-title{display:block;font-size:12px;font-weight:700}.settings-sub{display:block;font-size:10px;color:var(--muted);line-height:1.45;margin-top:2px}
.file-input{display:none}
bdi{unicode-bidi:isolate}
@media (max-width:350px){.hero-value{font-size:52px}.quick-grid{grid-template-columns:repeat(3,1fr)}.header-actions{gap:4px}.lang-btn{padding:0 7px}.period-btn{padding:0 8px}.metric-value{font-size:17px}}
@media (prefers-reduced-motion:reduce){*,*:before,*:after{scroll-behavior:auto!important;transition:none!important;animation:none!important}}

/* ---- fast entry ---- */
#quickPane{display:flex;flex-direction:column;gap:0}
.qamt{text-align:center;padding:16px 0 8px}
.qamt-v{font-size:52px;font-weight:500;letter-spacing:-.045em;line-height:1;
  font-variant-numeric:tabular-nums;direction:ltr;color:var(--ink)}
.qamt-v.zero{color:#C9CCC6}
.qamt-c{font-size:10px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;
  color:var(--muted);margin-top:8px}
[dir="rtl"] .qamt-c{letter-spacing:0;text-transform:none;font-size:12px}
.qchips{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;padding-bottom:14px}
.qchip{background:var(--surface);border:1px solid var(--line);border-radius:99.0px;padding:7px 14px;
  font:inherit;font-size:12px;font-weight:600;color:var(--ink);cursor:pointer}
.qgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;padding-bottom:12px}
.qm{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:11px 4px 9px;
  cursor:pointer;font:inherit;display:flex;flex-direction:column;align-items:center;gap:6px;
  transition:transform .12s}
.qm:active{transform:scale(.94)}
.qm-ic{width:34px;height:34px;border-radius:14px;display:flex;align-items:center;justify-content:center}
.qm-n{font-size:10px;font-weight:600;line-height:1.25;text-align:center;color:var(--ink);
  overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.qm-a{font-size:10px;color:var(--muted);font-variant-numeric:tabular-nums;margin-top:-3px}
.qm.more{border-style:dashed}
.qpad{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}
.qkey{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px 0;
  font:inherit;font-size:24px;font-weight:500;color:var(--ink);cursor:pointer;
  font-variant-numeric:tabular-nums;transition:transform .1s}
.qkey:active{transform:scale(.96);background:var(--soft)}
.qkey.fn{background:transparent;border-color:transparent;color:var(--muted);font-size:17px}

/* ===== motion =====
   Everything shares one easing curve so the app moves with a single personality.
   All of it collapses to nothing under prefers-reduced-motion. */
@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes fadein{from{opacity:0}to{opacity:1}}
button{transition:transform .14s cubic-bezier(.3,.8,.3,1),background .16s}
button:active{transform:scale(.972)}
.card,.hero{animation:rise .45s cubic-bezier(.22,.85,.3,1) both}
.card:nth-of-type(1){animation-delay:.04s}.card:nth-of-type(2){animation-delay:.10s}
.card:nth-of-type(3){animation-delay:.16s}.card:nth-of-type(4){animation-delay:.22s}
.card:nth-of-type(n+5){animation-delay:.26s}
.hero-value{transition:color .2s}
.bar-fill,[class*="progress"] > span,[class*="bar"] > i{transition:width .6s cubic-bezier(.22,.85,.3,1)}
.row,.list-row,.tx-row{transition:background .16s}
.row:active,.list-row:active,.tx-row:active{background:var(--soft)}
.full-overlay{transition:transform .32s cubic-bezier(.3,.85,.3,1),opacity .2s}
.qm,.qkey,.quick{transition:transform .12s cubic-bezier(.3,.8,.3,1),background .16s}
@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}
}
</style>
</head>
<body>
<div class="app" id="app">

const MEMORY_STORE=window.__QFIN_MEMORY_STORE__||(window.__QFIN_MEMORY_STORE__=new Map());
function storeGet(key){
  try{return window.localStorage.getItem(key)}catch(err){return MEMORY_STORE.has(key)?MEMORY_STORE.get(key):null}
}
function storeSet(key,value){
  const text=String(value);
  try{window.localStorage.setItem(key,text)}catch(err){MEMORY_STORE.set(key,text)}
}
function storeRemove(key){
  try{window.localStorage.removeItem(key)}catch(err){MEMORY_STORE.delete(key)}
}

function money(value,{sign=false,compact=false}={}){
  const n=Number(value||0)/100, abs=Math.abs(n);

  const num=new Intl.NumberFormat('en-QA',{minimumFractionDigits:0,maximumFractionDigits:0,
    notation:compact?'compact':'standard'}).format(Math.round(abs));
  return (n<0?'−':(sign&&n>0?'+':''))+num;
}

function dateAtNoon(input){const d=input instanceof Date?new Date(input):new Date(`${input}T12:00:00`);d.setHours(12,0,0,0);return d}
function isoDate(input){const d=input instanceof Date?input:dateAtNoon(input);return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}
function monthKey(input){const d=input instanceof Date?input:dateAtNoon(input);return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`}
function addDays(input,n){const d=dateAtNoon(input);d.setDate(d.getDate()+n);return d}
function addMonths(input,n){const d=dateAtNoon(input);const day=d.getDate();d.setDate(1);d.setMonth(d.getMonth()+n);const max=new Date(d.getFullYear(),d.getMonth()+1,0).getDate();d.setDate(Math.min(day,max));return d}
function daysBetween(a,b){return Math.round((dateAtNoon(b)-dateAtNoon(a))/DAY_MS)}
function monthsBetween(a,b){const x1=dateAtNoon(a),x2=dateAtNoon(b);return (x2.getFullYear()-x1.getFullYear())*12+x2.getMonth()-x1.getMonth()}
function startOfMonth(key){return dateAtNoon(`${key}-01`)}
function endOfMonth(key){const d=startOfMonth(key);return new Date(d.getFullYear(),d.getMonth()+1,0,12)}
function daysInMonth(key){return endOfMonth(key).getDate()}
function dateInMonth(key,day){return isoDate(new Date(startOfMonth(key).getFullYear(),startOfMonth(key).getMonth(),Math.min(day,daysInMonth(key)),12))}
function formatDate(iso,{short=false}={}){if(!iso)return '—';return new Intl.DateTimeFormat(isAr()?'ar-QA-u-nu-latn':'en-GB',short?{day:'numeric',month:'short'}:{day:'numeric',month:'short',year:'numeric'}).format(dateAtNoon(iso))}
function formatMonth(key){return new Intl.DateTimeFormat(isAr()?'ar-QA-u-nu-latn':'en-GB',{month:'long',year:'numeric'}).format(startOfMonth(key))}
function formatMonthShort(key){return new Intl.DateTimeFormat(isAr()?'ar-QA-u-nu-latn':'en-GB',{month:'short'}).format(startOfMonth(key))}
function clamp(v,min,max){return Math.max(min,Math.min(max,v))}
function pct(v,total){return total>0?clamp(v/total*100,0,100):0}
function sum(arr,fn=x=>x){return arr.reduce((a,b)=>a+Number(fn(b)||0),0)}
function todayISO(){return isoDate(NOW)}
function isFutureDate(iso){return dateAtNoon(iso)>NOW}

function normalizeState(candidate){

function validateState(candidate){

  for(const key of ['accounts','categories','transactions','plannedExpenses','loans'])if(!Array.isArray(candidate[key]))return {ok:false,error:`Missing ${key}`};
  const ids=new Set();
  for(const group of ['accounts','categories','merchants','transactions','plannedExpenses','loans']){
    for(const item of candidate[group]||[]){if(!item.id||ids.has(item.id))return {ok:false,error:`Invalid or duplicate ID in ${group}`};ids.add(item.id)}

/* ------------------ authoritative ledger calculations ------------------ */

/* Archived accounts remain part of net worth; `active` only controls new-entry lists. */

function liquidCash(){return sum(state.accounts.filter(a=>a.active&&isAssetAccount(a)&&a.includeInSafe),a=>Math.max(0,accountBalance(a.id)))}
function selectedMonthTransactions({actualOnly=true}={}){return state.transactions.filter(t=>monthKey(t.date)===ui.selectedMonth&&(!actualOnly||!t.planned))}
function ordinaryExpense(t){return t.type==='expense'&&!t.meta?.excludeFromBudget}
function categorySpend(categoryId,key=ui.selectedMonth){

  state.transactions.forEach(t=>{if(monthKey(t.date)!==key||t.planned||t.categoryId!==categoryId||t.meta?.excludeFromBudget)return;if(t.type==='expense')value+=t.amountMinor;if(t.type==='refund')value-=t.amountMinor});

}
function monthOrdinarySpend(key=ui.selectedMonth){

  state.transactions.forEach(t=>{if(monthKey(t.date)!==key||t.planned||t.meta?.excludeFromBudget)return;if(t.type==='expense')value+=t.amountMinor;if(t.type==='refund')value-=t.amountMinor});

function monthPlannedExpensePayments(key=ui.selectedMonth){return sum(state.plannedExpenses,p=>sum((p.activities||[]).filter(a=>a.type==='payment'&&monthKey(a.date)===key),a=>a.amountMinor))}
function monthActualLoanPayments(key=ui.selectedMonth){return sum(state.loans,l=>sum((l.payments||[]).filter(p=>monthKey(p.paidDate)===key),p=>p.amountMinor))}

function totalBudget(){return sum(state.categories.filter(c=>c.active),c=>c.budgetMonthlyMinor)}

/* ------------------ planned-expense calculations ------------------ */
function plannedDeposited(p){return sum(p.activities.filter(a=>a.type==='deposit'),a=>a.amountMinor)}

/* ------------------ loan calculations and actual payment ledger ------------------ */
function loanOutstanding(l){const a=accountById(l.liabilityAccountId);return a?Math.max(0,-accountBalance(a.id)):Math.max(0,l.originalPrincipalMinor-sum(l.payments,p=>p.principalMinor||0))}

/* ------------------ upcoming, forecasting and safe-to-spend ------------------ */
function scheduledTransactionsWithin(horizon){return state.transactions.filter(t=>t.planned&&dateAtNoon(t.date)>=NOW&&dateAtNoon(t.date)<=dateAtNoon(horizon))}

  const hasScheduledIncome=scheduled.some(t=>t.type==='income'&&(t.meta?.salary||/salary|راتب/i.test(`${t.nameEn||''} ${t.nameAr||''}`)||(profileIncome>0&&Math.abs(t.amountMinor-profileIncome)<=Math.max(100,profileIncome*.02))));

function transactionAccountList(type){
  if(type==='income')return state.accounts.filter(a=>a.active&&isAssetAccount(a));
  if(type==='transfer')return state.accounts.filter(a=>a.active&&isAssetAccount(a));
  return state.accounts.filter(a=>a.active&&a.type!=='loan');
}

/* =========================================================
   FAST ENTRY — numpad first, merchant amount prediction.
   Manual entry is the only way data gets in, so this path
   has to cost two taps and a number.
   ========================================================= */
let quickAmt='';
/* what this merchant usually costs: median of the last 12, so one odd
   big shop does not drag the suggestion the way a mean would */
function merchantTypicalMinor(merchantId){
  const amts=state.transactions
    .filter(t=>t.merchantId===merchantId&&t.type==='expense'&&!t.planned)
    .sort((a,b)=>dateAtNoon(b.date)-dateAtNoon(a.date))
    .slice(0,12).map(t=>t.amountMinor).sort((a,b)=>a-b);
  if(!amts.length)return 0;
  const mid=Math.floor(amts.length/2);
  return amts.length%2?amts[mid]:Math.round((amts[mid-1]+amts[mid])/2);
}
/* only suggest when the merchant is genuinely consistent */
function merchantIsPredictable(merchantId){
  const amts=state.transactions
    .filter(t=>t.merchantId===merchantId&&t.type==='expense'&&!t.planned)
    .slice(-8).map(t=>t.amountMinor);
  if(amts.length<3)return false;
  const typical=merchantTypicalMinor(merchantId);if(!typical)return false;
  const within=amts.filter(a=>Math.abs(a-typical)<=Math.max(200,typical*0.15)).length;
  return within/amts.length>=0.6;
}

function base64ToBytes(value){const binary=atob(value),out=new Uint8Array(binary.length);for(let i=0;i<binary.length;i++)out[i]=binary.charCodeAt(i);return out}
async function deriveBackupKey(password,salt){const material=await crypto.subtle.importKey('raw',new TextEncoder().encode(password),'PBKDF2',false,['deriveKey']);return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:250000,hash:'SHA-256'},material,{name:'AES-GCM',length:256},false,['encrypt','decrypt'])}
async function encryptBackupObject(obj,password){const salt=crypto.getRandomValues(new Uint8Array(16)),iv=crypto.getRandomValues(new Uint8Array(12)),key=await deriveBackupKey(password,salt),plain=new TextEncoder().encode(JSON.stringify(obj)),cipher=await crypto.subtle.encrypt({name:'AES-GCM',iv},key,plain);return {format:'qfin-encrypted-v1',schemaVersion:SCHEMA_VERSION,salt:bytesToBase64(salt),iv:bytesToBase64(iv),data:bytesToBase64(new Uint8Array(cipher))}}
async function decryptBackupObject(envelope,password){const salt=base64ToBytes(envelope.salt),iv=base64ToBytes(envelope.iv),data=base64ToBytes(envelope.data),key=await deriveBackupKey(password,salt),plain=await crypto.subtle.decrypt({name:'AES-GCM',iv},key,data);return JSON.parse(new TextDecoder().decode(plain))}
function exportPlain(){state.settings.lastExport=new Date().toISOString();saveState();downloadBlob(new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),`finance-v2-backup-${todayISO()}.json`);renderAll();showToast(x('Backup exported','تم تصدير النسخة'))}
async function exportEncrypted(){const password=window.prompt(x('Enter a strong password with at least 8 characters for the encrypted backup. The password cannot be recovered.','أدخل كلمة مرور قوية من 8 أحرف على الأقل للنسخة المشفرة. لا يمكن استعادة كلمة المرور.'));if(password===null)return;if(password.length<8){showToast(x('Password must contain at least 8 characters','يجب أن تتكون كلمة المرور من 8 أحرف على الأقل'));return}try{state.settings.lastExport=new Date().toISOString();saveState();const envelope=await encryptBackupObject(state,password);downloadBlob(new Blob([JSON.stringify(envelope,null,2)],{type:'application/json'}),`finance-v2-encrypted-${todayISO()}.json`);renderAll();showToast(x('Encrypted backup exported','تم تصدير النسخة المشفرة'))}catch(err){console.error(err);showToast(x('Encrypted export failed','فشل التصدير المشفر'))}}
async function handleImportFile(file){
  if(!file)return;try{const raw=await file.text();let parsed=JSON.parse(raw);if(parsed?.format==='qfin-encrypted-v1'){const password=window.prompt(x('Enter the backup password','أدخل كلمة مرور النسخة الاحتياطية'));if(password===null)return;parsed=await decryptBackupObject(parsed,password)}const valid=validateState(parsed);if(!valid.ok)throw new Error(valid.error);ui.pendingImport=normalizeState(parsed);openSheet(x('Restore backup','استعادة النسخة الاحتياطية'),`<div class="notice warn">${x('The file passed structural validation. A local pre-restore copy of the current data will be created before replacement.','اجتاز الملف التحقق البنيوي. سيتم إنشاء نسخة محلية قبل الاستعادة من البيانات الحالية قبل الاستبدال.')}</div><div class="kv"><span>${x('Accounts','الحسابات')}</span><span>${ui.pendingImport.accounts.length}</span></div><div class="kv"><span>${x('Transactions','العمليات')}</span><span>${ui.pendingImport.transactions.length}</span></div><div class="kv"><span>${x('Planned expenses','المصروفات المخططة')}</span><span>${ui.pendingImport.plannedExpenses.length}</span></div><div class="kv"><span>${x('Loans','القروض')}</span><span>${ui.pendingImport.loans.length}</span></div><div class="kv"><span>${x('Sample mode','الوضع التجريبي')}</span><span>${ui.pendingImport.settings.sampleMode?x('Yes','نعم'):x('No','لا')}</span></div><div class="form-actions"><button class="ghost-btn" data-action="close-sheet">${x('Cancel','إلغاء')}</button><button class="primary" data-action="confirm-import">${x('Restore','استعادة')}</button></div>`)}catch(err){console.error(err);showToast(x(`Invalid backup: ${err.message}`,`نسخة غير صالحة: ${err.message}`))}finally{document.getElementById('importFile').value=''}}
function confirmImport(){if(!ui.pendingImport)return;try{storeSet(PRE_RESTORE_KEY,JSON.stringify(state));state=ui.pendingImport;ui.pendingImport=null;saveState();closeSheet();ui.selectedMonth=monthKey(NOW);ui.view='home';renderAll();showToast(x('Backup restored and validated','تمت استعادة النسخة والتحقق منها'))}catch(err){const previous=storeGet(PRE_RESTORE_KEY);if(previous){state=normalizeState(JSON.parse(previous));saveState()}showToast(x('Restore failed; previous data retained','فشلت الاستعادة وتم الاحتفاظ بالبيانات السابقة'))}}
function hasMeaningfulData(){return state.accounts.length||state.transactions.length||state.plannedExpenses.length||state.loans.length}
function loadSampleData(){const apply=()=>{const lang=state.settings.language;state=sampleState();state.settings.language=lang;saveState();closeSheet();ui.view='home';ui.selectedMonth=monthKey(NOW);renderAll();showToast(x('Sample data loaded','تم تحميل البيانات التجريبية'))};if(hasMeaningfulData())confirmSheet(x('Replace current data with sample data?','استبدال البيانات الحالية ببيانات تجريبية؟'),x('A pre-replacement copy will be kept locally, but the visible app data will be replaced.','سيتم الاحتفاظ بنسخة محلية قبل الاستبدال، لكن بيانات التطبيق الظاهرة ستستبدل.'),x('Load sample','تحميل التجريبي'),()=>{storeSet(PRE_RESTORE_KEY,JSON.stringify(state));apply()});else apply()}
function clearSampleData(){if(!state.settings.sampleMode){showToast(x('Sample mode is not active','الوضع التجريبي غير مفعل'));return}confirmSheet(x('Clear sample data?','مسح البيانات التجريبية؟'),x('This removes the fictional accounts, transactions, plans and loans.','سيحذف ذلك الحسابات والعمليات والخطط والقروض الخيالية.'),x('Clear sample','مسح التجريبي'),()=>{const lang=state.settings.language;state=emptyState();state.settings.language=lang;saveState();closeSheet();ui.view='home';renderAll();showToast(x('Sample data cleared','تم مسح البيانات التجريبية'))})}
function clearLedger(){confirmSheet(x('Clear financial activity?','مسح النشاط المالي؟'),x('Transactions, planned-expense activity and recorded loan payments will be removed. Accounts and setup will remain.','سيتم حذف العمليات ونشاط المصروفات المخططة ودفعات القروض المسجلة، مع بقاء الحسابات والإعدادات.'),x('Clear activity','مسح النشاط'),()=>{state.transactions=[];state.plannedExpenses.forEach(p=>p.activities=[]);state.loans.forEach(l=>l.payments=[]);saveState();closeSheet();renderAll();showToast(x('Financial activity cleared','تم مسح النشاط المالي'))})}
function resetPreferences(){confirmSheet(x('Reset preferences?','إعادة ضبط التفضيلات؟'),x('The language will return to English, the buffer to QAR 5,000 and the horizon to 30 days.','ستعود اللغة إلى الإنجليزية والاحتياطي إلى 5,000 ر.ق والأفق إلى 30 يوماً.'),x('Reset','إعادة ضبط'),()=>{state.settings.language='en';state.settings.minimumBufferMinor=500000;state.settings.horizonDays=30;saveState();closeSheet();renderAll();showToast('Preferences reset')},{danger:false})}
function deleteAllData(){confirmSheet(x('Delete all app data?','حذف جميع بيانات التطبيق؟'),x('This permanently removes accounts, transactions, categories, planned expenses, loans, profile data and preferences from this browser.','سيؤدي ذلك إلى حذف الحسابات والعمليات والفئات والمصروفات المخططة والقروض وبيانات الملف والتفضيلات نهائياً من هذا المتصفح.'),x('Delete everything','حذف الكل'),()=>{storeRemove(STORAGE_KEY);storeRemove(PRE_RESTORE_KEY);state=emptyState();state.categories=[];saveState();closeSheet();ui.view='home';ui.selectedMonth=monthKey(NOW);renderAll();showToast(x('All app data deleted','تم حذف جميع بيانات التطبيق'))})}
/* =========================================================
   ARCHIVING AND CROSS-MODULE ACTIONS
   ========================================================= */
function archiveAccount(id){const a=accountById(id);if(!a)return;const linked=state.loans.some(l=>l.active&&l.liabilityAccountId===id);if(linked){showToast(x('Archive the linked financing first','أرشف التمويل المرتبط أولاً'));return}if(Math.abs(accountBalance(id))>1){showToast(x('Reconcile the account to zero before archiving','طابق الحساب إلى رصيد صفري قبل الأرشفة'));return}confirmSheet(x('Archive account?','أرشفة الحساب؟'),x('The account will disappear from entry lists, while its historical transactions remain available.','سيختفي الحساب من قوائم الإدخال مع بقاء عملياته التاريخية.'),x('Archive','أرشفة'),()=>{a.active=false;saveState();closeSheet();renderAll();showToast(x('Account archived','تمت أرشفة الحساب'))},{danger:false})}
function archiveCategory(id){const c=categoryById(id);if(!c)return;confirmSheet(x('Archive category?','أرشفة الفئة؟'),x('Historical transactions keep the category, but it will no longer appear in new transaction entry.','ستحتفظ العمليات التاريخية بالفئة، لكنها لن تظهر عند إدخال عمليات جديدة.'),x('Archive','أرشفة'),()=>{c.active=false;saveState();closeSheet();renderAll();showToast(x('Category archived','تمت أرشفة الفئة'))},{danger:false})}
function archivePlanned(id){const p=plannedById(id);if(!p)return;confirmSheet(x('Archive planned expense?','أرشفة المصروف المخطط؟'),x('Its activity history will remain in the backup but it will no longer affect Safe to Spend.','سيبقى سجل النشاط في النسخة الاحتياطية، لكنه لن يؤثر في المبلغ الآمن للإنفاق.'),x('Archive','أرشفة'),()=>{p.active=false;saveState();closeSheet();renderAll();showToast(x('Planned expense archived','تمت أرشفة المصروف المخطط'))},{danger:false})}
function archiveLoan(id){const l=loanById(id);if(!l)return;confirmSheet(x('Archive financing?','أرشفة التمويل؟'),x('The payment history and liability account remain available, but future installments will no longer affect forecasts.','سيبقى سجل الدفعات وحساب الالتزام متاحين، لكن الأقساط المستقبلية لن تؤثر في التوقعات.'),x('Archive','أرشفة'),()=>{l.active=false;saveState();closeSheet();renderAll();showToast(x('Financing archived','تمت أرشفة التمويل'))},{danger:false})}
function openLinkedRecord(txId){const t=transactionById(txId);if(!t)return;closeSheet();if(t.meta?.loanPaymentId){const l=state.loans.find(q=>q.payments?.some(p=>p.id===t.meta.loanPaymentId));if(l){ui.view='plan';ui.planTab='loans';renderAll();setTimeout(()=>openLoan(l.id),0);return}}if(t.meta?.plannedExpenseId){ui.view='plan';ui.planTab='planned';renderAll();setTimeout(()=>openPlanned(t.meta.plannedExpenseId),0)}}

/* =========================================================
   GLOBAL EVENT ROUTING
   ========================================================= */
document.addEventListener('click',e=>{
  const nav=e.target.closest('[data-nav]');if(nav){ui.view=nav.dataset.nav;renderAll();window.scrollTo({top:0,behavior:'smooth'});return}
  const el=e.target.closest('[data-action]');if(!el)return;const action=el.dataset.action,id=el.dataset.id;
  switch(action){
    case 'quick-key':quickKey(id);break;
    case 'quick-type':ui.txType=id;quickRender();break;
    case 'quick-save':quickSave(id,el.dataset.typical);break;
    case 'quick-save-cat':quickSaveCategory(id);break;
    case 'quick-open-full':quickShowFull();break;
    case 'close-sheet':closeSheet();break;
    case 'close-transaction':closeTransaction();break;
    case 'choose-month':chooseMonthSheet();break;
    case 'select-month':ui.selectedMonth=id;closeSheet();renderAll();break;
    case 'toggle-language':state.settings.language=isAr()?'en':'ar';saveState();renderAll();if(document.getElementById('transactionOverlay').classList.contains('open'))renderTransactionForm(ui.editingTxId?transactionById(ui.editingTxId):null);break;
    case 'go-settings':ui.view='settings';renderAll();window.scrollTo(0,0);break;
    case 'go-insights':ui.view='insights';renderAll();window.scrollTo(0,0);break;
    case 'go-plan':ui.view='plan';renderAll();window.scrollTo(0,0);break;
    case 'safe-breakdown':safeBreakdownSheet();break;
    case 'new-transaction':openTransaction('expense');break;
    case 'quick-add':openTransaction('expense',{merchantId:id});break;
    case 'tx-type':ui.txType=id;renderTransactionForm(null);break;
    case 'tx-merchant':selectTxMerchant(id);break;
    case 'open-transaction':openTransactionDetail(id);break;
    case 'edit-transaction':{const t=transactionById(id);closeSheet();setTimeout(()=>openTransaction(t?.type||'expense',{id}),180);break}
    case 'delete-transaction':deleteTransaction(id);break;
    case 'mark-posted':markTransactionPosted(id);break;
    case 'open-linked-record':openLinkedRecord(id);break;
    case 'show-upcoming':showUpcomingSheet(90);break;
    case 'show-transactions':showTransactionSearch();break;
    case 'new-transaction-from-sheet':closeSheet();setTimeout(()=>openTransaction('expense'),170);break;
    case 'show-overdue':showOverdueSheet();break;
    case 'open-upcoming':if(el.dataset.kind==='transaction')openTransactionDetail(id);else if(el.dataset.kind==='loan')openLoan(id);else openPlanned(id);break;
    case 'open-account':openAccount(id);break;
    case 'add-account':accountForm();break;
    case 'edit-account':closeSheet();setTimeout(()=>accountForm(id),170);break;
    case 'reconcile-account':closeSheet();setTimeout(()=>reconcileAccount(id),170);break;
    case 'archive-account':archiveAccount(id);break;
    case 'plan-tab':ui.planTab=id;renderAll();break;
    case 'open-category':if(ui.view!=='plan'){ui.view='plan';ui.planTab='budgets';renderAll()}openCategory(id);break;
    case 'add-category':categoryForm();break;
    case 'edit-category':closeSheet();setTimeout(()=>categoryForm(id),170);break;
    case 'archive-category':archiveCategory(id);break;
    case 'select-color':{const hidden=document.getElementById('catColor');if(hidden){hidden.value=el.dataset.color;document.querySelectorAll('#catColors .chip').forEach(b=>b.classList.toggle('active',b===el))}break}
    case 'select-icon':{const hidden=document.getElementById('catIcon');if(hidden){hidden.value=el.dataset.icon;document.querySelectorAll('#catIcons .chip').forEach(b=>b.classList.toggle('active',b===el))}break}
    case 'open-planned':if(ui.view!=='plan'){ui.view='plan';ui.planTab='planned';renderAll()}openPlanned(id);break;
    case 'add-planned':plannedForm();break;
    case 'edit-planned':closeSheet();setTimeout(()=>plannedForm(id),170);break;
    case 'planned-deposit':closeSheet();setTimeout(()=>plannedDepositForm(id),170);break;
    case 'planned-payment':closeSheet();setTimeout(()=>plannedPaymentForm(id),170);break;
    case 'archive-planned':archivePlanned(id);break;
    case 'next-planned-cycle':{const p=plannedById(id);if(p){advancePlannedCycle(p);saveState();closeSheet();renderAll();showToast(x('Next funding cycle started','تم بدء دورة التمويل التالية'))}break}
    case 'open-loan':if(ui.view!=='plan'){ui.view='plan';ui.planTab='loans';renderAll()}openLoan(id);break;
    case 'add-loan':loanForm();break;
    case 'edit-loan':closeSheet();setTimeout(()=>loanForm(id),170);break;
    case 'loan-payment':closeSheet();setTimeout(()=>loanPaymentForm(id),170);break;
    case 'archive-loan':archiveLoan(id);break;
    case 'edit-profile':profileForm();break;
    case 'edit-planning':planningSettingsForm();break;
    case 'export-backup':exportPlain();break;
    case 'export-encrypted':exportEncrypted();break;
    case 'import-backup':document.getElementById('importFile').click();break;
    case 'confirm-import':confirmImport();break;
    case 'load-sample':loadSampleData();break;
    case 'clear-sample':clearSampleData();break;
    case 'clear-ledger':clearLedger();break;
    case 'reset-settings':resetPreferences();break;
    case 'delete-all':deleteAllData();break;
    case 'confirm-action':{const fn=ui.pendingConfirm;ui.pendingConfirm=null;if(fn)fn();break}
  }
});

document.getElementById('transactionForm').addEventListener('submit',saveTransactionFromForm);
document.getElementById('txRecurring').addEventListener('change',e=>{document.getElementById('txRecurringFields').hidden=!e.target.checked});
document.getElementById('txDate').addEventListener('change',e=>{if(isFutureDate(e.target.value))document.getElementById('txPlanned').checked=true});
document.getElementById('txAccount').addEventListener('change',()=>{if(ui.txType==='transfer')renderTxDynamic(ui.editingTxId?transactionById(ui.editingTxId):null)});
document.getElementById('importFile').addEventListener('change',e=>handleImportFile(e.target.files?.[0]));
document.getElementById('toastUndo').addEventListener('click',()=>{const fn=undoAction;closeToast();if(fn)fn()});
document.getElementById('sheetOverlay').addEventListener('click',e=>{if(e.target===document.getElementById('sheetOverlay'))closeSheet()});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(document.getElementById('transactionOverlay').classList.contains('open'))closeTransaction();else if(document.getElementById('sheetOverlay').classList.contains('open'))closeSheet()}});

/* =========================================================
   INITIALIZATION
   ========================================================= */
state=loadState();
ui.selectedMonth=monthKey(NOW);
renderAll();
if(!hasMeaningfulData())showToast(x('Add an account or load sample data to begin','أضف حساباً أو حمّل البيانات التجريبية للبدء'));
</script>
</body>
</html>
