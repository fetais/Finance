<style>
:root{
 --bg:#F7F7F5;          /* warm paper, not the default cool grey */
 --card:#FFF; --ink:#101317; --muted:#8C8C86; --line:#E6E6E1;
 --teal:#0F5C56; --tealLite:#E8EFEE; --amber:#B87514; --red:#C0392E;
 --lime:#C8F169;        /* single vivid accent, used only on the dark card */
 --f:'Space Grotesk','Cairo',system-ui,sans-serif;
 --num:'Space Grotesk','Cairo',system-ui,sans-serif;
 --sh:none}
/* hairlines instead of drop shadows — the uniform floating-card look was the problem */
.card{border:1px solid var(--line)}
.eyebrow,.chead h3{font-feature-settings:'ss01'}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body,button,input,select,a,.tx,.brow,.srow,.cell,.itile,.key,.chip,.cpill,.lrow{touch-action:manipulation}
input,textarea{font-size:16px}  /* stops iOS zooming the page when a field is focused */
body{background:#EAEAE6;font-family:var(--f);color:var(--ink);display:flex;justify-content:center}
.phone{width:100%;max-width:430px;background:var(--bg);min-height:100vh;position:relative;padding-bottom:110px}
button:focus-visible{outline:2px solid var(--teal);outline-offset:2px;border-radius:12px}
.view{display:none}.view.on{display:block}.wrap{padding:0 18px}
svg.ic{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

.hdr{display:flex;align-items:center;justify-content:space-between;
 padding:calc(20px + env(safe-area-inset-top)) 18px 16px}
.hi .a{font-size:17px;font-weight:700}.hi .b{font-size:12px;color:var(--muted);margin-top:1px}
.hdr .r{display:flex;align-items:center;gap:8px}
.pill{background:var(--card);border:1px solid var(--line);border-radius:99px;padding:8px 13px;
 font-family:var(--f);font-size:12px;font-weight:600;color:var(--ink);cursor:pointer}
.pill.ghost{background:transparent;box-shadow:none;color:var(--muted);font-weight:500}

.hero{background:var(--ink);border-radius:20px;padding:22px 20px 20px;color:#fff;box-shadow:none}
.hero .lab{font-size:9.5px;opacity:.55;font-weight:600;letter-spacing:.16em;text-transform:uppercase}
[dir="rtl"] .hero .lab{letter-spacing:0;text-transform:none;font-size:12px}
.hero .row{display:flex;align-items:flex-end;justify-content:space-between;margin-top:6px;gap:12px}
.hero .big{font-size:34px;font-weight:700;letter-spacing:-.02em;line-height:1.1}
.hero .big small{font-size:12px;font-weight:600;opacity:.5;margin-inline-start:6px;letter-spacing:0}
.spark{width:112px;height:46px;flex:none}
.hstats{display:flex;margin-top:18px;border-top:1px solid rgba(255,255,255,.16);padding-top:14px}
.hstats div{flex:1}.hstats .k{font-size:9px;opacity:.5;margin-bottom:5px;letter-spacing:.12em;text-transform:uppercase;font-weight:600}
[dir="rtl"] .hstats .k{letter-spacing:0;text-transform:none;font-size:11px}
.hstats .v{font-size:15px;font-weight:500;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.hstats .v.warn{color:var(--lime)}
.hstats{border-top:1px solid rgba(255,255,255,.14)}

.qa{display:flex;gap:9px;margin-top:16px}
.qbtn{flex:1;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 4px;
 cursor:pointer;font-family:var(--f);display:flex;flex-direction:column;align-items:center;gap:6px}
.qic{width:36px;height:36px;border-radius:12px;display:flex;align-items:center;justify-content:center}
.qbtn .t{font-size:10.5px;font-weight:600;color:var(--ink)}
.qbtn .s{font-size:9.5px;color:var(--muted);margin-top:-3px}

.card{background:var(--card);border-radius:16px;padding:16px 16px 14px;margin-top:14px}
.chead{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.chead h3{font-size:10px;font-weight:700;letter-spacing:.15em;text-transform:uppercase;color:var(--muted)}
[dir="rtl"] .chead h3{letter-spacing:0;text-transform:none;font-size:13px;color:var(--ink)}
.chead .more{font-size:11px;color:var(--ink);font-weight:600;background:none;border:none;
 font-family:var(--f);border-bottom:1.5px solid var(--ink);padding-bottom:1px;line-height:1}

.donut{display:flex;align-items:center;gap:14px}
.dwrap{position:relative;flex:none}
.dcen{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.dcen .v{font-size:19px;font-weight:500;letter-spacing:-.03em;font-family:var(--num);font-variant-numeric:tabular-nums}
.dcen .k{font-size:9px;color:var(--muted);margin-top:-1px}
.leg{flex:1;display:flex;flex-direction:column;gap:6px}
.lrow{display:flex;align-items:center;gap:7px;font-size:11px;background:none;border:none;
 font-family:var(--f);padding:1px 0;cursor:pointer;width:100%;color:inherit}
.lrow .d{width:7px;height:7px;border-radius:2px;flex:none}
.lrow .n{flex:1;color:var(--muted);text-align:start}
.lrow .p{font-weight:700;font-variant-numeric:tabular-nums}

.tx{display:flex;align-items:center;gap:12px;padding:9px 0;width:100%;background:none;border:none;
 font-family:var(--f);cursor:pointer;color:inherit;text-align:start}
.tic{width:38px;height:38px;border-radius:12px;flex:none;display:flex;align-items:center;justify-content:center}
.tx .m{flex:1;min-width:0}
.tx .n{font-size:13.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tx .s{font-size:11px;color:var(--muted);margin-top:1px}
.tx .a{font-size:14px;font-weight:500;font-variant-numeric:tabular-nums;font-family:var(--num);letter-spacing:-.02em}

.seg{display:flex;background:#EDEDE8;border-radius:13px;padding:4px}
.seg button{flex:1;border:none;background:none;font-family:var(--f);font-size:12.5px;font-weight:600;
 color:var(--muted);padding:9px 0;border-radius:10px;cursor:pointer}
.seg button.on{background:var(--card);color:var(--ink)}
.brow{padding:13px 0;border-bottom:1px solid var(--line);width:100%;background:none;border-left:none;
 border-right:none;border-top:none;font-family:var(--f);cursor:pointer;color:inherit}
.brow:last-child{border-bottom:none;padding-bottom:2px}
.btop{display:flex;align-items:center;gap:10px;margin-bottom:9px}
.btop .nm{flex:1;font-size:13px;font-weight:600;text-align:start}
.btop .sp{font-size:13px;font-weight:500;font-variant-numeric:tabular-nums;font-family:var(--num);letter-spacing:-.02em}
.btop .sp b{font-weight:400;color:var(--muted)}
.btr{height:7px;background:#EDEFF2;border-radius:99px;position:relative}
.btr i{display:block;height:100%;border-radius:99px}
.tick{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--ink);opacity:.35;border-radius:2px}
.bfoot{display:flex;justify-content:space-between;margin-top:7px;font-size:10.5px;color:var(--muted)}
.bfoot .r{font-weight:700;font-variant-numeric:tabular-nums}
.bfoot .r.a{color:var(--amber)}.bfoot .r.o{color:var(--red)}

.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.dow{font-size:9.5px;color:var(--muted);text-align:center;padding-bottom:5px;font-weight:600}
.cell{aspect-ratio:1;border-radius:11px;display:flex;flex-direction:column;align-items:center;
 justify-content:center;gap:1px;background:#F7F8FA}
.cell.out{background:transparent}
.cell .d{font-size:10.5px;color:var(--muted);font-weight:600}
.cell .a{font-size:8.5px;font-weight:700;font-variant-numeric:tabular-nums}
.cell.out .d{opacity:.28}.cell.we{background:var(--tealLite)}
.cell.dpick{border:none;font-family:var(--f);cursor:pointer}
.cell.today{background:var(--teal)}.cell.today .d,.cell.today .a{color:#fff!important}
.bars{display:flex;align-items:flex-end;gap:2px;height:104px;position:relative}
.bars i{flex:1;border-radius:3px 3px 0 0;min-height:3px;
 background:linear-gradient(180deg,#2C8C99,#10646E)}
.bars i.we{background:linear-gradient(180deg,#C9A24E,#B07C25)}
.bars i.zero{height:3px;background:#E1E4E9;border-radius:99px}
.bars i.future{height:3px;background:#EFF1F4;border-radius:99px}
.avgline{position:absolute;inset-inline:0;height:0;border-top:1px dashed #A7AFBB;z-index:2;pointer-events:none}
.blegend{display:flex;gap:14px;margin-top:11px;font-size:9.5px;color:var(--muted);align-items:center}
.blegend span{display:flex;align-items:center;gap:5px}
.sw{width:8px;height:8px;border-radius:2px;display:inline-block}
.sw.wk{background:#10646E}.sw.we{background:#B07C25}.sw.zr{background:#E1E4E9}
.axis{display:flex;justify-content:space-between;margin-top:7px;font-size:10px;color:var(--muted)}

.srow{display:flex;align-items:center;gap:12px;padding:13px 0;border-bottom:1px solid var(--line);
 width:100%;background:none;border-left:none;border-right:none;border-top:none;font-family:var(--f);
 cursor:pointer;color:inherit;text-align:start}
.srow:last-child{border-bottom:none}
.sic{width:34px;height:34px;border-radius:11px;flex:none;display:flex;align-items:center;justify-content:center}
.srow .m{flex:1}.srow .n{font-size:13px;font-weight:600}
.srow .s{font-size:10.5px;color:var(--muted);margin-top:1px}
.srow .ch{color:var(--muted);font-size:15px}

.scrim{position:fixed;inset:0;background:rgba(16,24,40,.42);opacity:0;pointer-events:none;
 transition:opacity .25s;z-index:40}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;bottom:0;width:100%;max-width:430px;background:var(--card);
 border-radius:26px 26px 0 0;padding:10px 20px 34px;z-index:50;transform:translateY(102%);
 transition:transform .3s cubic-bezier(.3,.8,.3,1);max-height:82vh;overflow-y:auto}
.sheet.on{transform:translateY(0)}
.grab{width:38px;height:4px;background:#DDE1E6;border-radius:99px;margin:0 auto 16px}
.shead{display:flex;align-items:center;gap:12px;margin-bottom:16px}
.shead .nm{flex:1}.shead .nm .t{font-size:16px;font-weight:700}
.shead .nm .s{font-size:11.5px;color:var(--muted);margin-top:2px}
.irow{display:flex;align-items:center;gap:11px;padding:11px 0;border-bottom:1px solid var(--line)}
.irow:last-child{border-bottom:none}
.irow .bar{flex:1}
.irow .n{font-size:12.5px;font-weight:600;margin-bottom:5px;display:flex;justify-content:space-between}
.irow .n span:last-child{font-weight:700;font-variant-numeric:tabular-nums}
.mini{height:5px;background:#EDEFF2;border-radius:99px}.mini i{display:block;height:100%;border-radius:99px}
.mrow{display:flex;align-items:center;justify-content:space-between;padding:14px 2px;
 border-bottom:1px solid var(--line);width:100%;background:none;border-left:none;border-right:none;
 border-top:none;font-family:var(--f);cursor:pointer;color:inherit;font-size:13.5px;font-weight:600}
.mrow:last-child{border-bottom:none}
.mrow .amt{font-weight:700;font-variant-numeric:tabular-nums;color:var(--muted)}
.mrow.on{color:var(--teal)}
.sbtns{display:flex;gap:10px;margin-top:20px}
.sbtn{flex:1;padding:14px;border:none;border-radius:15px;font-family:var(--f);font-size:13px;
 font-weight:700;cursor:pointer}
.sbtn.edit{background:var(--tealLite);color:var(--teal)}
.sbtn.del{background:#FBEBEA;color:var(--red)}

/* add overlay */
.add-ov{position:fixed;inset:0;z-index:60;background:var(--bg);max-width:430px;margin:0 auto;
 display:flex;flex-direction:column;transform:translateY(100%);
 transition:transform .32s cubic-bezier(.3,.85,.3,1)}
.add-ov.on{transform:translateY(0)}
.ahead{display:flex;align-items:center;justify-content:space-between;padding:18px 20px 0}
.ahead .t{font-size:15px;font-weight:700}
.xbtn{background:none;border:none;font-size:22px;color:var(--muted);cursor:pointer;font-family:var(--f);
 line-height:1;padding:4px 6px}
.amt-disp{text-align:center;padding:20px 20px 12px}
.amt-disp .v{font-size:54px;font-weight:500;letter-spacing:-.045em;font-variant-numeric:tabular-nums;font-family:var(--num);
 line-height:1;direction:ltr;display:inline-block}
.amt-disp .v.zero{color:#C7CCD3}
.amt-disp .c{font-size:12px;color:var(--muted);font-weight:600;margin-top:7px}
.chips{display:flex;gap:8px;justify-content:center;padding-bottom:14px}
.chip{background:var(--card);border:1px solid var(--line);border-radius:99px;padding:7px 14px;
 font-family:var(--f);font-size:11.5px;font-weight:600;color:var(--ink);cursor:pointer;
 display:flex;align-items:center;gap:6px}
.chip svg{width:14px;height:14px}
.catbar{display:flex;gap:7px;overflow-x:auto;padding:2px 16px 12px;scrollbar-width:none}
.catbar::-webkit-scrollbar{display:none}
.cchip{flex:none;border:1.5px solid var(--line);background:var(--card);border-radius:99px;
 padding:7px 13px;font-family:var(--f);font-size:11.5px;font-weight:600;color:var(--muted);
 cursor:pointer;display:flex;align-items:center;gap:6px;white-space:nowrap}
.cchip svg{width:14px;height:14px}
.cchip.on{color:var(--ink);border-color:currentColor}
.cchip.mk{border-style:dashed}
.igrid{flex:1;overflow-y:auto;padding:0 16px 6px;display:grid;grid-template-columns:repeat(4,1fr);
 gap:9px;align-content:start}
.itile{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:11px 4px 9px;
 cursor:pointer;font-family:var(--f);display:flex;flex-direction:column;align-items:center;gap:6px;
 transition:transform .12s}
.itile:active{transform:scale(.94)}
.itile .ii{width:34px;height:34px;border-radius:11px;display:flex;align-items:center;justify-content:center}
.itile .nn{font-size:9.5px;font-weight:600;line-height:1.25;text-align:center;overflow:hidden;
 display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.itile.new{background:transparent;box-shadow:none;border:1.5px dashed #D3D8DE}
.itile.new .ii{background:#E9ECF0;color:var(--muted)}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;padding:10px 16px 26px}
.key{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 0;font-family:var(--num);
 font-size:20px;font-weight:500;color:var(--ink);cursor:pointer;font-variant-numeric:tabular-nums}
.key:active{background:#EDEFF2}
.key.fn{background:transparent;box-shadow:none;color:var(--muted);font-size:18px}
.hintbar{text-align:center;font-size:10.5px;color:var(--muted);padding:0 20px 8px}
.nform{padding:0 18px}
.nform input{width:100%;background:var(--card);border:1.5px solid var(--line);border-radius:14px;
 padding:13px 15px;font-family:var(--f);font-size:14px;color:var(--ink);outline:none}
.nform input:focus{border-color:var(--teal)}
.catpick{display:flex;flex-wrap:wrap;gap:7px;margin-top:14px}
.cpill{border:1.5px solid var(--line);background:var(--card);border-radius:99px;padding:8px 13px;
 font-family:var(--f);font-size:11.5px;font-weight:600;cursor:pointer;display:flex;align-items:center;gap:6px}
.cpill svg{width:14px;height:14px}.cpill.on{border-color:currentColor}
.primary{width:100%;margin-top:18px;padding:15px;border:none;border-radius:16px;background:var(--teal);
 color:#fff;font-family:var(--f);font-size:14px;font-weight:700;cursor:pointer}
.primary:disabled{background:#C7CCD3}

/* empty */
.empty{text-align:center;padding:34px 24px}
.empty .ill{width:78px;height:78px;border-radius:26px;background:var(--tealLite);color:var(--teal);
 display:flex;align-items:center;justify-content:center;margin:0 auto 18px}
.empty .ill svg{width:34px;height:34px;stroke-width:1.6}
.empty h4{font-size:16px;font-weight:700;margin-bottom:7px}
.empty p{font-size:12.5px;color:var(--muted);line-height:1.65;max-width:270px;margin:0 auto}

.toast{position:fixed;bottom:104px;left:50%;transform:translate(-50%,16px);z-index:80;background:var(--ink);
 color:#fff;padding:11px 18px;border-radius:99px;font-size:12.5px;font-weight:600;opacity:0;
 pointer-events:none;transition:all .3s;white-space:nowrap}
.toast.on{opacity:1;transform:translate(-50%,0)}

/* ===== motion + polish ===== */
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes pop{0%{transform:scale(.9);opacity:0}60%{transform:scale(1.03)}100%{transform:scale(1);opacity:1}}
@keyframes glow{from{opacity:0}to{opacity:1}}
button{transition:transform .14s cubic-bezier(.3,.8,.3,1)}
button:active{transform:scale(.972)}
.ni:active,.pill:active{transform:scale(.94)}
.hero{position:relative;overflow:hidden}
.hero::after{content:'';position:absolute;top:-58px;inset-inline-end:-42px;width:190px;height:190px;
 border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.16),transparent 68%);pointer-events:none}
.hero>*{position:relative;z-index:1}
.hero .big{font-size:38px;letter-spacing:-.035em}
.spark path,.spark circle{will-change:opacity}
.scrim{backdrop-filter:blur(3px)}
.sheet{transition:transform .38s cubic-bezier(.22,.9,.28,1)}
.seg{position:relative}
.seg3 .thumb{width:calc(33.333% - 3px)!important}
.seg .thumb{position:absolute;top:4px;bottom:4px;width:calc(50% - 4px);background:var(--card);
 border-radius:10px;border:1px solid var(--line);transition:transform .32s cubic-bezier(.3,.85,.3,1);z-index:0}
.seg button{position:relative;z-index:1;transition:color .2s}
.seg button.on{background:none;box-shadow:none}
.ni{position:relative;padding-top:5px}
.ni::before{content:'';position:absolute;top:-4px;width:22px;height:3px;border-radius:99px;
 background:var(--teal);opacity:0;transform:scaleX(.3);transition:all .3s cubic-bezier(.3,.85,.3,1)}
.ni.on::before{opacity:1;transform:scaleX(1)}
.ni svg{transition:transform .3s cubic-bezier(.3,.85,.3,1)}
.ni.on svg{transform:translateY(-1px) scale(1.06)}
.addb{transition:transform .18s cubic-bezier(.3,.8,.3,1),box-shadow .2s}
.addb:active{transform:scale(.9)}
.tx,.brow,.lrow,.srow{transition:background .18s,transform .14s;border-radius:12px}
.tx:active,.brow:active,.lrow:active,.srow:active{background:#F7F8FA}
.chead h3{letter-spacing:-.015em}
.amt-disp .v{transition:color .2s,transform .2s}
.amt-disp.saved .v{color:var(--teal);transform:scale(1.06)}
.dwrap circle{transition:stroke-dasharray .75s cubic-bezier(.22,.8,.3,1)}
.toast{box-shadow:0 8px 24px rgba(16,24,40,.24)}
@media(prefers-reduced-motion:reduce){
 *,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}

/* budget editor */

 border-top:1px solid var(--line);margin-top:6px}

.swatch{width:30px;height:30px;border-radius:9px;border:2px solid transparent;cursor:pointer;padding:0}
.swatch.on{border-color:var(--ink)}
.icpick{width:40px;height:40px;border-radius:12px;border:1.5px solid var(--line);background:var(--card);
 display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--muted)}
.icpick.on{border-color:var(--ink);color:var(--ink)}
.stepdots{display:flex;gap:6px;justify-content:center;padding:6px 0 14px}
.stepdots i{width:6px;height:6px;border-radius:99px;background:var(--line)}
.stepdots i.on{background:var(--teal);width:18px}
.tinybtn{background:var(--teal);border:none;font-family:var(--f);font-size:12.5px;font-weight:700;
 color:#fff;cursor:pointer;padding:12px 20px;border-radius:13px;flex:none;white-space:nowrap}
.tinybtn:disabled{background:#C7CCD3}
.tinybtn.del{background:#FBEBEA;color:var(--red);padding:8px 14px;font-size:11.5px;border-radius:10px}
.additem{display:flex;gap:8px;align-items:stretch;margin-top:12px}
.additem input{flex:1;min-width:0;background:var(--bg);border:1.5px solid var(--line);
 border-radius:13px;padding:12px 14px;font-family:var(--f);font-size:13.5px;color:var(--ink);outline:none}
.additem input:focus{border-color:var(--teal);background:#fff}
.nav{position:fixed;bottom:0;width:100%;max-width:430px;background:rgba(255,255,255,.94);
 backdrop-filter:blur(16px);border-top:1px solid var(--line);display:flex;align-items:center;
 justify-content:space-around;padding:11px 8px calc(14px + env(safe-area-inset-bottom));z-index:30}
.ni{background:none;border:none;font-family:var(--f);font-size:9.5px;font-weight:600;color:var(--muted);
 cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;flex:1}

 background:var(--ink);color:#fff;font-size:24px;font-weight:300;
 display:flex;align-items:center;justify-content:center;padding-bottom:4px}
</style>
</head>
<body>
<div class="phone">
  <div class="hdr">

<script>
/* ---------- icons ---------- */
const IC={
cart:'<circle cx="9.5" cy="20" r="1.3"/><circle cx="17.5" cy="20" r="1.3"/><path d="M2 3h3l2.6 12.2h11L21 7H6"/>',
cup:'<path d="M5 8h11v6a5 5 0 0 1-5 5h-1a5 5 0 0 1-5-5z"/><path d="M16 9.5h2.2a2.4 2.4 0 0 1 0 4.8H16"/><path d="M4 21.5h14"/>',
home:'<path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/>',
car:'<path d="M4 16.5V12l1.8-4.5h12.4L20 12v4.5"/><path d="M4 16.5h16"/><circle cx="7.6" cy="17.6" r="1.5"/><circle cx="16.4" cy="17.6" r="1.5"/>',
loop:'<path d="M17 2.5 20.5 6 17 9.5"/><path d="M20 6H7.5a3.5 3.5 0 0 0 0 7h9a3.5 3.5 0 0 1 0 7H3.5"/><path d="M7 21.5 3.5 18 7 14.5"/>',
bag:'<path d="M5 8h14l-1.1 12H6.1z"/><path d="M9 8V6.2a3 3 0 0 1 6 0V8"/>',
plane:'<path d="M21.5 3 2.8 11.2l7 2.6 2.6 7z"/><path d="M21.5 3 9.8 13.8"/>',
cap:'<path d="M12 4 2 9l10 5 10-5z"/><path d="M6 11.5V17c0 1.6 2.7 3 6 3s6-1.4 6-3v-5.5"/>',
tool:'<path d="M15.6 3.6a5 5 0 0 0-6.4 6.4L3 16.2V21h4.8l6.2-6.2a5 5 0 0 0 6.4-6.4l-3 3-2.9-.7-.7-2.9z"/>',
shield:'<path d="M12 3 4.5 6v6c0 4.5 3.2 7.9 7.5 9 4.3-1.1 7.5-4.5 7.5-9V6z"/>',
heart:'<path d="M12 20.5S3.5 15.2 3.5 9.6A4.3 4.3 0 0 1 12 7.3a4.3 4.3 0 0 1 8.5 2.3c0 5.6-8.5 10.9-8.5 10.9z"/>',
dots:'<circle cx="5.5" cy="12" r="1.5"/><circle cx="12" cy="12" r="1.5"/><circle cx="18.5" cy="12" r="1.5"/>',
globe:'<circle cx="12" cy="12" r="9"/><path d="M3 12h18"/><path d="M12 3a15 15 0 0 1 0 18 15 15 0 0 1 0-18"/>',
tag:'<path d="M3 11V4h7l10 10-7 7z"/><circle cx="7.5" cy="7.5" r="1.3"/>',
coin:'<ellipse cx="12" cy="6.5" rx="8" ry="3.2"/><path d="M4 6.5v11c0 1.8 3.6 3.2 8 3.2s8-1.4 8-3.2v-11"/><path d="M4 12c0 1.8 3.6 3.2 8 3.2s8-1.4 8-3.2"/>',
lock:'<rect x="4.5" y="10" width="15" height="11" rx="3"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/>',
down:'<path d="M12 3v13"/><path d="M7 11.5 12 16.5l5-5"/><path d="M4 20.5h16"/>',
date:'<rect x="3.5" y="5" width="17" height="16" rx="3.5"/><path d="M3.5 10h17"/><path d="M8 3v4M16 3v4"/>',
trash:'<path d="M4 6.5h16"/><path d="M9.5 6.5V4.5h5v2"/><path d="M6 6.5 7 20.5h10L18 6.5"/>',
plus:'<path d="M12 5v14M5 12h14"/>',
bank:'<path d="M3 9.5 12 4l9 5.5"/><path d="M5 9.5V19M9.5 9.5V19M14.5 9.5V19M19 9.5V19"/><path d="M2.5 19h19"/>',
card:'<rect x="2.5" y="5" width="19" height="14" rx="3.5"/><path d="M2.5 10h19"/><path d="M6 15h3"/>',
wallet:'<path d="M3 7.5A2.5 2.5 0 0 1 5.5 5H18v3"/><rect x="3" y="7.5" width="18" height="12.5" rx="3"/><circle cx="17" cy="14" r="1.2"/>'};
const svg=(k,cls='ic')=>`<svg class="${cls}" viewBox="0 0 24 24">${IC[k]}</svg>`;

/* ---------- motion ---------- */
const REDUCED=window.matchMedia('(prefers-reduced-motion: reduce)').matches;
let ANIM=true,lastTotal=null;
function countUp(el,to){
  if(REDUCED||lastTotal===null||lastTotal===to){el.firstChild.textContent=mn(to);return}
  const from=lastTotal,t0=performance.now(),dur=620;
  (function step(t){
    const p=Math.min(1,(t-t0)/dur),e=1-Math.pow(1-p,3);
    el.firstChild.textContent=mn(from+(to-from)*e);
    if(p<1)requestAnimationFrame(step);
  })(t0);
}
function animateIn(){
  if(REDUCED||!ANIM)return;
  const root=document.querySelector('.view.on');if(!root)return;
  root.querySelectorAll(':scope > .hero, :scope > .qa, :scope > .card, :scope .card, :scope .hero')
    .forEach((el,i)=>{el.style.animation='none';void el.offsetHeight;
      el.style.animation=`rise .52s cubic-bezier(.22,.85,.3,1) ${Math.min(i,6)*58}ms both`});
}
function animateCharts(){
  if(REDUCED)return;
  document.querySelectorAll('.bars i').forEach((b,i)=>{
    const h=b.style.height;b.style.transition='none';b.style.height='2px';
    requestAnimationFrame(()=>{b.style.transition=`height .55s cubic-bezier(.22,.85,.3,1) ${Math.min(i,30)*11}ms`;
      b.style.height=h});
  });
  document.querySelectorAll('.btr i, .mini i, .sumbar i').forEach((b,i)=>{
    const w=b.style.width;b.style.transition='none';b.style.width='0';
    requestAnimationFrame(()=>{b.style.transition=`width .6s cubic-bezier(.22,.85,.3,1) ${Math.min(i,8)*55}ms`;
      b.style.width=w});
  });
  document.querySelectorAll('.dwrap circle[stroke-dasharray]').forEach((c,i)=>{
    const d=c.getAttribute('stroke-dasharray'),parts=d.split(' ');
    c.style.transition='none';c.setAttribute('stroke-dasharray','0 '+parts[1]);
    requestAnimationFrame(()=>{c.style.transition=`stroke-dasharray .8s cubic-bezier(.22,.85,.3,1) ${i*70}ms`;
      c.setAttribute('stroke-dasharray',d)});
  });
}
function moveThumb(){
  const t=document.getElementById('segThumb');if(!t)return;
  const rtl=document.documentElement.dir==='rtl';
  const n=BUD==='m'?0:(BUD==='y'?1:2);
  const off=(rtl?-100*n:100*n)+'%';
  t.style.transform=`translateX(${off})`;
}

/* ---------- category definitions ---------- */
const CATS=[
 {en:"Groceries",ar:"بقالة",b:2200,c:"#2E8B72",ic:"cart",items:[

function seedRand(s){return()=>{s=(s*1103515245+12345)&0x7fffffff;return s/0x7fffffff}}

const isWeekend=(m,d)=>{const w=dow(m,d);return w===5||w===6};

/* Build a plausible ledger: fixed bills on set days, weekly groceries,
   weekend-weighted dining, periodic fuel, occasional shopping. */
function genMonth(k){  // sample data only, loaded on request
  const m=MONTHS[k],r=seedRand(k.charCodeAt(5)*3671+k.charCodeAt(6)*97+m.dim),tx=[];
  const rr=(lo,hi)=>Math.round(lo+r()*(hi-lo));
  const add=(ci,ii,day,a)=>{if(day>=1&&day<=m.elapsed&&a>0)
    tx.push({en:CATS[ci].items[ii].en,ar:CATS[ci].items[ii].ar,ci,a,day,acc:0})};

  add(2,1,3,222);                               // Ooredoo Home
  add(4,0,3,295);                               // Ooredoo Mobile
  add(2,0,5,rr(360,470));                       // Kahramaa

  for(let d=1;d<=m.elapsed;d++){
    const w=dow(m,d),we=isWeekend(m,d);
    if(w===4)              add(0,0,d,rr(210,430));        // Thursday big shop
    if(w===1&&r()<.7)      add(0,1,d,rr(85,180));         // Al Meera midweek
    if(w===6&&r()<.45)     add(0,2,d,rr(55,120));         // Family Food
    if(we&&r()<.75)        add(1,0,d,rr(95,190));         // Turkey Central
    if(!we&&r()<.35)       add(1,1,d,rr(22,48));          // Espresso Lab
    if(r()<.16)            add(1,2,d,rr(55,125));         // Talabat
    if(r()<.42)            add(1,3,d,rr(5,14));           // Karak
    if(d%8===2)            add(3,0,d,rr(140,195));        // Woqod
    if(r()<.14)            add(3,1,d,rr(25,60));          // Karwa
    if(r()<.18)            add(3,2,d,rr(10,25));          // Parking
    if(r()<.055)           add(5,0,d,rr(120,520));        // Shopping
  }
  m.tx=tx.sort((a,b)=>b.day-a.day||b.a-a.a);
  recompute(m);
}
/* transactions are the single source of truth — everything else derives */
function recompute(m){
  m.spend=CATS.map(()=>0);
  m.daily=new Array(m.dim).fill(0);
  m.extra=0;
  m.items=CATS.map(c=>c.items.map(it=>({en:it.en,ar:it.ar,a:0,fresh:it.fresh})));
  m.tx.forEach(t=>{
    if(t.t==='i'){m.extra+=t.a;return}
    if(t.ci>=CATS.length)return;
    m.spend[t.ci]+=t.a;
    m.daily[t.day-1]=(m.daily[t.day-1]||0)+t.a;
    const it=m.items[t.ci].find(x=>x.en===t.en);
    if(it)it.a+=t.a; else m.items[t.ci].push({en:t.en,ar:t.ar,a:t.a});
  });
}

function sparkPath(){
  const m=Mo(),d=m.daily.slice(0,m.future?m.dim:m.elapsed);
  const tot=d.reduce((a,b)=>a+(b||0),0)||1;let cum=0,pts=[[0,42]];
  d.forEach((v,i)=>{cum+=(v||0);pts.push([(i+1)/Math.max(1,d.length)*112,42-(cum/tot)*36])});
  const p=pts.map((q,i)=>(i?'L':'M')+q[0].toFixed(1)+','+q[1].toFixed(1)).join(' ');
  return `<path d="${p} L112,46 L0,46 Z" fill="rgba(255,255,255,.14)"/>
    <path d="${p}" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="112" cy="${pts[pts.length-1][1].toFixed(1)}" r="3.4" fill="#fff"/>`;
}
function donutPath(){
  const m=Mo(),tot=spent()||1,C=2*Math.PI*45;let off=0;
  let h=`<circle cx="59" cy="59" r="45" fill="none" stroke="#F1F3F5" stroke-width="15"/>`;
  CATS.forEach((c,i)=>{const len=m.spend[i]/tot*C;if(len<=0)return;
    h+=`<circle cx="59" cy="59" r="45" fill="none" stroke="${c.c}" stroke-width="15"
      stroke-dasharray="${Math.max(1,len-3)} ${C}" stroke-dashoffset="${-off}"
      transform="rotate(-90 59 59)" stroke-linecap="round"/>`;off+=len});
  return h;
}

function fundsView(){
  const me=monthsElapsed();
  const fAnnual=FUNDS.reduce((a,f)=>a+f.annual,0);
  const fSpent=FUNDS.reduce((a,f)=>a+fundSpent(f),0);
  const fAccrued=FUNDS.reduce((a,f)=>a+fundAccrued(f),0);
  const fBal=fAccrued-fSpent;
  /* day-to-day, expressed annually */
  const ytd=CATS.map((c,i)=>PASTKEYS().reduce((a,k)=>a+(MONTHS[k].spend[i]||0),0));
  const dAnnual=CATS.reduce((a,c)=>a+c.b*12,0);
  const dSpent=ytd.reduce((a,b)=>a+b,0);

      return `<div class="brow" style="cursor:default"><div class="btop">

          <span class="nm" style="flex:1">${L(f)}<span style="display:block;font-size:10.5px;color:var(--muted);font-weight:500;margin-top:2px">

      const over=sp>exp*1.02, near=!over&&sp>exp*.9;
      const cc=over?'#D0453A':near?'#D08A1E':c.c;
      const p=Math.min(100,sp/ann*100), t=Math.min(100,exp/ann*100);
      const diff=Math.round(sp-exp);
      return `<button class="brow" data-cat="${i}"><div class="btop">

    <div style="display:flex;align-items:baseline;gap:9px;margin-bottom:8px">
      <span style="font-size:27px;font-weight:700;font-variant-numeric:tabular-nums;
        color:${projected>grandBudget?'var(--red)':'var(--teal)'}">${mn(projected)}</span>
      <span style="font-size:12px;font-weight:700;color:${projected>grandBudget?'var(--red)':'var(--teal)'}">
        ${projected>grandBudget?'+':'−'}${mn(Math.abs(projected-grandBudget))}</span></div>
    <p style="font-size:11.5px;color:var(--muted);line-height:1.65">${AR
      ?`بمعدل إنفاقك اليومي الحالي (${mn(dSpent/me)} شهرياً) زائد المخصصات السنوية، ستنهي ${YR} عند ${mn(projected)}.`
      :`At your current day-to-day rate of ${mn(dSpent/me)} a month, plus the annual funds, you finish ${YR} at ${mn(projected)}.`}</p>

  document.getElementById('addFund').onclick=()=>fundForm(-1);
  document.querySelectorAll('[data-dep]').forEach(b=>b.onclick=e=>{
    e.stopPropagation();depositSheet(+b.dataset.dep)});
  const fa=document.getElementById('fundAll');
  if(fa)fa.onclick=()=>{
    FUNDS.forEach(f=>{const short=alloc(f)-fundDepThisMonth(f);
      if(short>0){f.deposits=f.deposits||{};f.deposits[NOWKEY]=(f.deposits[NOWKEY]||0)+short}});
    save();reflow();toast(AR?'تم تمويل كل الجيوب':'All pockets funded');};
}

const ICONSET=["cart","cup","home","car","loop","bag","plane","cap","tool","shield","heart","coin","card","date","tag"];
let catEdit=null;

function openCatManager(){drawCatManager();document.getElementById('catov').classList.add('on')}
function drawCatManager(){
  catEdit=null;
  document.getElementById('catovtitle').textContent=AR?'الفئات والبنود':'Categories & items';
  document.getElementById('catovBody').innerHTML=`
    <div class="card" style="margin-top:6px">
    ${CATS.map((c,i)=>`<button class="srow" data-ce="${i}">
      <span class="sic" style="background:${c.c}1F;color:${c.c}">${svg(c.ic)}</span>
      <span class="m"><span class="n">${L(c)}</span>
      <span class="s">${c.items.length} ${AR?'بند':'items'} · ${mn(c.b)}/${AR?'شهر':'mo'}</span></span>
      <span class="ch">${AR?'‹':'›'}</span></button>`).join('')}</div>
    <button class="primary" id="addCat">${AR?'إضافة فئة':'Add category'}</button>`;
  document.getElementById('addCat').onclick=()=>editCategory(-1);
  document.querySelectorAll('[data-ce]').forEach(b=>b.onclick=()=>editCategory(+b.dataset.ce));
}
function editCategory(idx){
  const isNew=idx<0;
  catEdit=isNew?{en:'',ar:'',b:500,c:PALETTE[CATS.length%PALETTE.length],ic:'tag',items:[]}
               :JSON.parse(JSON.stringify(CATS[idx]));
  document.getElementById('catovtitle').textContent=isNew
    ?(AR?'فئة جديدة':'New category'):(AR?'تعديل الفئة':'Edit category');
  const used=isNew?0:KEYS.reduce((a,k)=>a+MONTHS[k].tx.filter(t=>t.t!=='i'&&t.ci===idx).length,0);
  document.getElementById('catovBody').innerHTML=`
  <div class="nform" style="padding:0">
    <input id="cEn" placeholder="${AR?'الاسم بالإنجليزية':'Name in English'}" value="${catEdit.en}">
    <input id="cAr" placeholder="${AR?'الاسم بالعربية':'Name in Arabic'}" value="${catEdit.ar}" style="margin-top:9px">
    <input id="cB" type="number" inputmode="numeric" placeholder="${AR?'الميزانية الشهرية':'Monthly budget'}"
      value="${catEdit.b}" style="margin-top:9px">
    <p class="eyebrow" style="margin:18px 0 8px">${AR?'اللون':'Colour'}</p>
    <div style="display:flex;gap:8px;flex-wrap:wrap">${PALETTE.map(c=>
      `<button class="swatch ${c===catEdit.c?'on':''}" data-col="${c}" style="background:${c}"></button>`).join('')}</div>
    <p class="eyebrow" style="margin:18px 0 8px">${AR?'الأيقونة':'Icon'}</p>
    <div style="display:flex;gap:8px;flex-wrap:wrap">${ICONSET.map(k=>
      `<button class="icpick ${k===catEdit.ic?'on':''}" data-ic="${k}">${svg(k)}</button>`).join('')}</div>
    <p class="eyebrow" style="margin:20px 0 4px">${AR?'البنود':'Items'}</p>
    <div class="card" style="margin-top:8px" id="itemList"></div>
    <button class="primary" id="cSave" style="margin-top:18px">${AR?'حفظ':'Save'}</button>
    ${!isNew?`<button class="primary" id="cDel" style="background:#FBEBEA;color:var(--red);margin-top:9px">
      ${AR?'حذف الفئة':'Delete category'}</button>
      ${used?`<p style="font-size:11px;color:var(--muted);margin-top:10px;text-align:center">${
        AR?`هذه الفئة مستخدمة في ${used} عملية — الحذف سيزيلها أيضاً.`
          :`Used by ${used} transaction${used>1?'s':''} — deleting removes those too.`}</p>`:''}`:''}
  </div>`;
  drawItemList();
  document.querySelectorAll('[data-col]').forEach(b=>b.onclick=()=>{catEdit.c=b.dataset.col;
    document.querySelectorAll('[data-col]').forEach(x=>x.classList.remove('on'));b.classList.add('on')});
  document.querySelectorAll('[data-ic]').forEach(b=>b.onclick=()=>{catEdit.ic=b.dataset.ic;
    document.querySelectorAll('[data-ic]').forEach(x=>x.classList.remove('on'));b.classList.add('on')});
  document.getElementById('cSave').onclick=()=>{
    const en=document.getElementById('cEn').value.trim();
    const ar=document.getElementById('cAr').value.trim();
    const b=parseFloat(document.getElementById('cB').value)||0;
    if(!en&&!ar){toast(AR?'أدخل اسماً':'Enter a name');return}
    catEdit.en=en||ar; catEdit.ar=ar||en; catEdit.b=Math.round(b);
    if(isNew)CATS.push(catEdit); else CATS[idx]=catEdit;
    KEYS.forEach(k=>recompute(MONTHS[k]));save();drawCatManager();reflow();
    toast(AR?'تم الحفظ':'Saved');};
  const del=document.getElementById('cDel');
  if(del)del.onclick=()=>{
    KEYS.forEach(k=>{const m=MONTHS[k];
      m.tx=m.tx.filter(t=>t.t==='i'||t.ci!==idx);
      m.tx.forEach(t=>{if(t.t!=='i'&&t.ci>idx)t.ci--})});
    CATS.splice(idx,1);
    KEYS.forEach(k=>recompute(MONTHS[k]));save();drawCatManager();reflow();
    toast(AR?'تم حذف الفئة':'Category deleted');};
}
function drawItemList(){
  const el=document.getElementById('itemList');if(!el)return;
  el.innerHTML=(catEdit.items.length?catEdit.items.map((it,i)=>`<div class="erow">
      <span class="col"><span class="nm">${L(it)}</span></span>
      <button class="tinybtn del" data-di="${i}">${AR?'حذف':'Remove'}</button></div>`).join('')
    :`<p style="font-size:11.5px;color:var(--muted);padding:10px 0;text-align:center">${
      AR?'لا توجد بنود بعد':'No items yet'}</p>`)
    +`<div class="additem"><input id="newIt" autocomplete="off"
       placeholder="${AR?'اسم البند الجديد':'New item name'}">
      <button class="tinybtn" id="addIt" disabled>${AR?'إضافة':'Add'}</button></div>`;
  document.querySelectorAll('[data-di]').forEach(b=>b.onclick=()=>{
    catEdit.items.splice(+b.dataset.di,1);drawItemList()});
  const inp=document.getElementById('newIt'),btn=document.getElementById('addIt');
  const addNow=()=>{const v=inp.value.trim();if(!v)return;
    catEdit.items.push({en:v,ar:v,w:0});drawItemList();
    setTimeout(()=>document.getElementById('newIt').focus(),0)};
  inp.oninput=()=>{btn.disabled=!inp.value.trim()};
  inp.onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();addNow()}};
  btn.onclick=addNow;
}

    <h3 style="font-size:19px;font-weight:700;margin-bottom:6px">${AR?'ما اسمك؟':'What should I call you?'}</h3>
    <p style="font-size:12.5px;color:var(--muted);line-height:1.6;margin-bottom:18px">${
      AR?'يظهر في أعلى الشاشة الرئيسية فقط.':'Only used for the greeting on your home screen.'}</p>

      placeholder="${AR?'الاسم':'Name'}"><button class="primary" id="sNext">${AR?'التالي':'Next'}</button></div>`;
  if(step===1)body=`${dots}
    <h3 style="font-size:19px;font-weight:700;margin-bottom:6px">${AR?'دخلك الشهري':'Monthly income'}</h3>
    <p style="font-size:12.5px;color:var(--muted);line-height:1.6;margin-bottom:18px">${
      AR?'راتبك الثابت. أي دخل إضافي تسجّله لاحقاً من زر الإضافة.'
        :'Your regular salary. Extra income gets logged later with the add button.'}</p>
    <div class="nform" style="padding:0"><input id="sSal" type="number" inputmode="numeric"
      value="${PROFILE.salary||''}" placeholder="0" style="font-size:22px;font-weight:700;text-align:center">
      <button class="primary" id="sNext">${AR?'التالي':'Next'}</button></div>`;
  if(step===2){
    const tot=CATS.reduce((a,c)=>a+c.b,0);
    body=`${dots}
    <h3 style="font-size:19px;font-weight:700;margin-bottom:6px">${AR?'الميزانية الشهرية':'Monthly budgets'}</h3>
    <p style="font-size:12.5px;color:var(--muted);line-height:1.6;margin-bottom:14px">${
      AR?'حدود إنفاقك اليومي. عدّلها الآن أو لاحقاً.':'Your day-to-day spending limits. Adjust now or later.'}</p>
    <div class="card" style="margin-top:0">${CATS.map((c,i)=>`<div class="erow">
      <span class="tic" style="width:32px;height:32px;border-radius:10px;background:${c.c}1F;color:${c.c}">${svg(c.ic)}</span>
      <span class="col"><span class="nm">${L(c)}</span></span>
      <input class="einput" type="number" inputmode="numeric" data-sb="${i}" value="${c.b}"></div>`).join('')}
      <div class="sumline"><span>${AR?'الإجمالي':'Total'}</span><b id="sbTot">${mn(tot)}</b></div></div>
    <button class="primary" id="sNext">${AR?'التالي':'Next'}</button>`;
  }
  if(step===3){
    const tot=FUNDS.reduce((a,f)=>a+f.annual,0);
    body=`${dots}
    <h3 style="font-size:19px;font-weight:700;margin-bottom:6px">${AR?'المصاريف السنوية':'Annual costs'}</h3>
    <p style="font-size:12.5px;color:var(--muted);line-height:1.6;margin-bottom:14px">${
      AR?'المبالغ الكبيرة غير الشهرية. يقسمها التطبيق على ١٢ ويتيح تراكمها حتى موعد الدفع.'
        :'Big non-monthly costs. The app divides each by 12 and lets it build up until the bill lands.'}</p>
    <div class="card" style="margin-top:0">${FUNDS.map((f,i)=>`<div class="erow">
      <span class="tic" style="width:32px;height:32px;border-radius:10px;background:${f.c}1F;color:${f.c}">${svg(f.ic)}</span>
      <span class="col"><span class="nm">${L(f)}</span>
        <span class="sug none" data-perm="${i}">${mn(f.annual/12)}/${AR?'شهر':'mo'}</span></span>
      <input class="einput" type="number" inputmode="numeric" data-sf="${i}" value="${f.annual}"></div>`).join('')}
      <div class="sumline"><span>${AR?'شهرياً':'Per month'}</span><b id="sfTot">${mn(tot/12)}</b></div></div>
    <button class="primary" id="sNext">${AR?'إنهاء':'Finish'}</button>`;
  }
  document.getElementById('setupBody').innerHTML=body;
  document.querySelectorAll('[data-sb]').forEach(inp=>inp.oninput=()=>{
    const v=parseFloat(inp.value)||0;CATS[+inp.dataset.sb].b=Math.round(v);
    document.getElementById('sbTot').textContent=mn(CATS.reduce((a,c)=>a+c.b,0))});
  document.querySelectorAll('[data-sf]').forEach(inp=>inp.oninput=()=>{
    const v=parseFloat(inp.value)||0,i=+inp.dataset.sf;FUNDS[i].annual=Math.round(v);
    document.querySelector(`[data-perm="${i}"]`).textContent=mn(v/12)+'/'+(AR?'شهر':'mo');
    document.getElementById('sfTot').textContent=mn(FUNDS.reduce((a,f)=>a+f.annual,0)/12)});
  const nx=document.getElementById('sNext');
  if(nx)nx.onclick=()=>{
    if(step===0){const v=document.getElementById('sName').value.trim();
      if(!v){toast(AR?'أدخل اسمك':'Enter your name');return}PROFILE.name=v}
    if(step===1)PROFILE.salary=Math.round(parseFloat(document.getElementById('sSal').value)||0);
    save();
    if(step<3){step++;drawSetup()} else {closeSetup();toast(AR?'كل شيء جاهز':'All set')}};
}


/* ---------- loans ---------- */
let LOANS=[
 {en:"Car finance",ar:"تمويل السيارة",c:"#7B7AA6",ic:"car",
  kind:"rate",principal:90000,rate:4.5,count:60,every:1,start:"2025-03"},
 {en:"Laptop instalments",ar:"أقساط اللابتوب",c:"#2E8B72",ic:"card",
  kind:"free",principal:8000,count:4,every:1,start:"2026-07"},
 {en:"Land balloon",ar:"دفعة الأرض",c:"#3A6E96",ic:"bank",
  kind:"rate",principal:200000,rate:5,count:1,every:36,start:"2029-01"}];

/* A loan is N payments, spaced `every` months apart, starting at `start`.
   every=1,count=60 → normal monthly loan.  count=4 → instalments.  count=1 → balloon. */
const loanPeriods=l=>Math.max(1,l.count||1);
const loanEvery=l=>Math.max(1,l.every||1);
const loanPeriodRate=l=>(l.rate||0)/100*(loanEvery(l)/12);
const loanPayment=l=>{
  const n=loanPeriods(l);
  if(l.kind==='rate'){const i=loanPeriodRate(l);
    return i>0? l.principal*i/(1-Math.pow(1+i,-n)) : l.principal/n}
  if(l.kind==='profit')return (l.principal+(l.profit||0))/n;
  return l.principal/n;
};
/* months from now until a given YYYY-MM (negative = in the past) */
const monthsUntil=str=>{const [y,mm]=str.split('-').map(Number);return (y-YR)*12+((mm-1)-MO)};
const loanElapsed=l=>-monthsUntil(l.start);
const loanPaidCount=l=>{
  const e=loanElapsed(l);
  if(e<0)return 0;
  return Math.max(0,Math.min(loanPeriods(l),Math.floor(e/loanEvery(l))+1));
};
const loanTotal=l=>loanPayment(l)*loanPeriods(l);
const loanCost=l=>loanTotal(l)-l.principal;
const loanRemaining=l=>Math.max(0,loanPayment(l)*(loanPeriods(l)-loanPaidCount(l)));
const loanBalance=l=>{
  const k=loanPaidCount(l),n=loanPeriods(l);
  if(l.kind==='rate'){const i=loanPeriodRate(l);
    if(i<=0)return Math.max(0,l.principal-l.principal/n*k);
    const pmt=loanPayment(l);
    return Math.max(0,l.principal*Math.pow(1+i,k)-pmt*((Math.pow(1+i,k)-1)/i))}
  return Math.max(0,l.principal-l.principal/n*k);
};
const loanSplit=l=>{
  if(l.kind!=='rate')return {int:loanCost(l)/loanPeriods(l),pri:loanPayment(l)-loanCost(l)/loanPeriods(l)};
  const int=loanBalance(l)*loanPeriodRate(l);
  return {int,pri:loanPayment(l)-int};
};
/* month index of the final payment, relative to now */
const loanMonthsLeft=l=>{
  const k=loanPaidCount(l),n=loanPeriods(l);
  if(k>=n)return 0;
  return Math.max(1,monthsUntil(l.start)+(n-1)*loanEvery(l));
};
const loanNextDue=l=>{
  const k=loanPaidCount(l),n=loanPeriods(l);
  if(k>=n)return null;
  const [y,mm]=l.start.split('-').map(Number);
  return new Date(y,mm-1+k*loanEvery(l),1);
};
const fmtMon=d=>d?(AR?`${MN_AR[d.getMonth()]} ${d.getFullYear()}`:`${MN_EN[d.getMonth()]} ${d.getFullYear()}`):'—';
const loanEndDate=l=>{const [y,mm]=l.start.split('-').map(Number);
  return new Date(y,mm-1+(loanPeriods(l)-1)*loanEvery(l),1)};
/* what actually leaves the account this month */
const loanDueNow=l=>{
  const e=loanElapsed(l);
  if(e<0||loanPaidCount(l)>loanPeriods(l))return 0;
  return (e%loanEvery(l)===0&&Math.floor(e/loanEvery(l))<loanPeriods(l))?loanPayment(l):0;
};
/* what you should put aside each month to meet it */
const loanAccrual=l=>{
  const left=loanRemaining(l);if(left<=0)return 0;
  return left/Math.max(1,loanMonthsLeft(l));
};
const activeLoans=()=>LOANS.filter(l=>loanPaidCount(l)<loanPeriods(l));
const loansMonthly=()=>activeLoans().reduce((a,l)=>a+loanAccrual(l),0);
const loansDueNow=()=>activeLoans().reduce((a,l)=>a+loanDueNow(l),0);
const loansOwed=()=>activeLoans().reduce((a,l)=>a+loanRemaining(l),0);
const kindLabel=k=>k==='rate'?(AR?'بفائدة':'Interest'):k==='profit'?(AR?'مرابحة':'Profit rate'):(AR?'بدون فائدة':'Interest-free');
const freqLabel=l=>{
  const n=loanPeriods(l),e=loanEvery(l);
  if(n===1)return AR?'دفعة واحدة':'One payment';
  if(e===1)return AR?`${n} قسط شهري`:`${n} monthly`;
  if(e===3)return AR?`${n} أقساط ربع سنوية`:`${n} quarterly`;
  if(e===12)return AR?`${n} أقساط سنوية`:`${n} yearly`;
  return AR?`${n} أقساط كل ${e} أشهر`:`${n} payments every ${e} months`;
};


function depositSheet(i){
  const f=FUNDS[i],suggested=Math.max(0,alloc(f)-fundDepThisMonth(f))||alloc(f);
  openSheet(`<div class="shead"><span class="tic" style="width:44px;height:44px;border-radius:14px;background:${f.c}1F;color:${f.c}">${svg(f.ic)}</span>
    <span class="nm"><span class="t">${AR?'إيداع في '+L(f):'Deposit into '+L(f)}</span>
    <span class="s">${AR?'في الجيب الآن':'In pocket now'} ${mn(fundPocket(f))}</span></span></div>
  <div class="nform" style="padding:0">
    <input id="dAmt" type="number" inputmode="numeric" value="${Math.round(suggested)}"
      style="font-size:26px;font-weight:700;text-align:center">
    <div style="display:flex;gap:7px;margin-top:12px;flex-wrap:wrap">
      <button class="cpill" data-dq="${Math.round(alloc(f))}">${AR?'الشهري':'Monthly'} ${mn(alloc(f))}</button>
      ${fundGap(f)<-1?`<button class="cpill" data-dq="${Math.round(-fundGap(f))}">${
        AR?'تعويض المتأخر':'Catch up'} ${mn(-fundGap(f))}</button>`:''}
    </div>
    <button class="primary" id="dSave" style="margin-top:18px">${AR?'إيداع':'Deposit'}</button>
    <button class="primary" id="pOpen" style="background:var(--tealLite);color:var(--teal);margin-top:9px">
      ${AR?'تسجيل دفعة من الجيب':'Record a payment out'}</button>
  </div>`);
  document.querySelectorAll('[data-dq]').forEach(b=>b.onclick=()=>{
    document.getElementById('dAmt').value=b.dataset.dq});
  document.getElementById('dSave').onclick=()=>{
    const v=parseFloat(document.getElementById('dAmt').value)||0;
    if(v<=0){toast(AR?'أدخل مبلغاً':'Enter an amount');return}
    f.deposits=f.deposits||{};f.deposits[NOWKEY]=(f.deposits[NOWKEY]||0)+v;
    save();closeSheet();reflow();toast((AR?'أُودع ':'Deposited ')+mn(v)+' · '+L(f));};
  document.getElementById('pOpen').onclick=()=>paymentSheet(i);
}
function paymentSheet(i){
  const f=FUNDS[i],bal=fundPocket(f);
  openSheet(`<div class="shead"><span class="tic" style="width:44px;height:44px;border-radius:14px;background:${f.c}1F;color:${f.c}">${svg(f.ic)}</span>
    <span class="nm"><span class="t">${AR?'دفعة من '+L(f):'Payment from '+L(f)}</span>
    <span class="s">${AR?'الرصيد':'Balance'} ${mn(bal)}</span></span></div>
  <div class="nform" style="padding:0">
    <input id="pAmt" type="number" inputmode="numeric" placeholder="0"
      style="font-size:26px;font-weight:700;text-align:center">
    <p style="font-size:11.5px;color:var(--muted);line-height:1.6;margin-top:12px;text-align:center" id="pWarn"></p>
    <button class="primary" id="pSave" style="margin-top:14px">${AR?'تسجيل الدفعة':'Record payment'}</button>
  </div>`);
  const inp=document.getElementById('pAmt'),w=document.getElementById('pWarn');
  inp.oninput=()=>{const v=parseFloat(inp.value)||0;
    w.textContent=v>bal?(AR?`يتجاوز الرصيد بـ ${mn(v-bal)} — سيظهر الجيب بالسالب.`
      :`${mn(v-bal)} more than the pocket holds — it will show a shortfall.`)
      :(v?(AR?`يتبقى ${mn(bal-v)} في الجيب`:`${mn(bal-v)} left in the pocket`):'');
    w.style.color=v>bal?'var(--red)':'var(--muted)'};
  inp.focus();
  document.getElementById('pSave').onclick=()=>{
    const v=parseFloat(inp.value)||0;
    if(v<=0){toast(AR?'أدخل مبلغاً':'Enter an amount');return}
    f.months=f.months||{};f.months[NOWKEY]=(f.months[NOWKEY]||0)+v;
    save();closeSheet();reflow();toast((AR?'سُجّلت دفعة ':'Payment of ')+mn(v)+' · '+L(f));};
}

    document.getElementById('fPerM').textContent=v?`= ${mn(v/12)} ${AR?'شهرياً':'per month'}`:''};
  upd();document.getElementById('fA').oninput=upd;
  document.querySelectorAll('[data-fc]').forEach(b=>b.onclick=()=>{f.c=b.dataset.fc;
    document.querySelectorAll('[data-fc]').forEach(x=>x.classList.remove('on'));b.classList.add('on')});
  document.querySelectorAll('[data-fi]').forEach(b=>b.onclick=()=>{f.ic=b.dataset.fi;
    document.querySelectorAll('[data-fi]').forEach(x=>x.classList.remove('on'));b.classList.add('on')});
  document.getElementById('fSaveNew').onclick=()=>{
    const en=document.getElementById('fEn').value.trim();
    const ar=document.getElementById('fAr').value.trim();
    const a=parseFloat(document.getElementById('fA').value)||0;
    if(!en&&!ar){toast(AR?'أدخل اسماً':'Enter a name');return}
    if(!a){toast(AR?'أدخل المبلغ':'Enter the amount');return}
    f.en=en||ar;f.ar=ar||en;f.annual=Math.round(a);
    if(isNew)FUNDS.push(f); else FUNDS[i]=f;
    save();closeSheet();reflow();toast(AR?'تم الحفظ':'Saved');};
  const del=document.getElementById('fDel');
  if(del)del.onclick=()=>{FUNDS.splice(i,1);save();closeSheet();reflow();

const PRESETS=[
 {enL:"Monthly",arL:"شهري",every:1,count:12},
 {enL:"Instalments",arL:"أقساط",every:1,count:4},
 {enL:"Quarterly",arL:"ربع سنوي",every:3,count:4},
 {enL:"One payment",arL:"دفعة واحدة",every:36,count:1}];

function loanForm(i){
  const isNew=i<0;
  const l=isNew?{en:'',ar:'',c:PALETTE[LOANS.length%PALETTE.length],ic:'bank',
    kind:'free',principal:0,rate:0,profit:0,count:4,every:1,
    start:`${YR}-${String(MO+1).padStart(2,'0')}`}:JSON.parse(JSON.stringify(LOANS[i]));
  openSheet(`<div class="shead"><span class="nm"><span class="t">${
    isNew?(AR?'قرض جديد':'New loan'):(AR?'تعديل القرض':'Edit loan')}</span></span></div>
  <div class="nform" style="padding:0">
    <input id="lEn" placeholder="${AR?'اسم القرض':'Loan name'}" value="${l.en}">

    <p class="eyebrow" style="margin:16px 0 6px">${AR?'المبلغ':'Amount borrowed'}</p>
    <input id="lP" type="number" inputmode="numeric" value="${l.principal||''}" placeholder="0">

    <p class="eyebrow" style="margin:18px 0 8px">${AR?'كيف تُسدَّد':'How it is repaid'}</p>
    <div style="display:flex;gap:7px;flex-wrap:wrap">${PRESETS.map((q,qi)=>
      `<button class="cpill" data-pre="${qi}">${AR?q.arL:q.enL}</button>`).join('')}</div>
    <div style="display:flex;gap:9px;margin-top:12px">
      <div style="flex:1"><p class="eyebrow" style="margin-bottom:5px">${AR?'عدد الدفعات':'Payments'}</p>
        <input id="lN" type="number" inputmode="numeric" value="${l.count}"></div>
      <div style="flex:1"><p class="eyebrow" style="margin-bottom:5px">${AR?'كل (أشهر)':'Every (months)'}</p>
        <input id="lE" type="number" inputmode="numeric" value="${l.every}"></div></div>

    <p class="eyebrow" style="margin:18px 0 8px">${AR?'التكلفة':'Cost of borrowing'}</p>
    <div class="seg seg3"><div class="thumb" id="lThumb"></div>
      <button data-lk="free">${AR?'بدون':'None'}</button>
      <button data-lk="profit">${AR?'مرابحة':'Profit'}</button>
      <button data-lk="rate">${AR?'فائدة':'Interest'}</button></div>
    <div id="lCostWrap"></div>

    <p class="eyebrow" style="margin:16px 0 6px">${AR?'أول دفعة':'First payment'}</p>
    <input id="lS" type="month" value="${l.start}">

    <div class="card" style="margin-top:16px" id="lPrev"></div>
    <button class="primary" id="lSave">${AR?'حفظ':'Save'}</button>
  </div>`);

  const kindOrder=['free','profit','rate'];
  function setKind(k){
    l.kind=k;
    document.querySelectorAll('[data-lk]').forEach(b=>b.classList.toggle('on',b.dataset.lk===k));
    const n=kindOrder.indexOf(k),rtl=document.documentElement.dir==='rtl';
    document.getElementById('lThumb').style.transform=`translateX(${rtl?-100*n:100*n}%)`;
    document.getElementById('lCostWrap').innerHTML=
      k==='rate'?`<p class="eyebrow" style="margin:14px 0 6px">${AR?'نسبة سنوية ٪':'Annual rate %'}</p>
        <input id="lR" type="number" inputmode="decimal" step="0.1" value="${l.rate||''}" placeholder="0">`
      :k==='profit'?`<p class="eyebrow" style="margin:14px 0 6px">${AR?'إجمالي الربح':'Total profit'}</p>
        <input id="lF" type="number" inputmode="numeric" value="${l.profit||''}" placeholder="0">`:'';
    const ex=document.getElementById('lR')||document.getElementById('lF');
    if(ex)ex.oninput=preview;
    preview();
  }
  function preview(){
    l.principal=parseFloat(document.getElementById('lP').value)||0;
    l.count=Math.max(1,parseInt(document.getElementById('lN').value)||1);
    l.every=Math.max(1,parseInt(document.getElementById('lE').value)||1);
    l.start=document.getElementById('lS').value||l.start;
    const r=document.getElementById('lR'),f=document.getElementById('lF');
    if(r)l.rate=parseFloat(r.value)||0;
    if(f)l.profit=parseFloat(f.value)||0;
    const pmt=loanPayment(l),cost=loanCost(l),acc=loanAccrual(l),ml=loanMonthsLeft(l);
    const lump=loanPeriods(l)===1;
    document.getElementById('lPrev').innerHTML=!l.principal?
      `<p style="font-size:11.5px;color:var(--muted);text-align:center;padding:6px 0">${
        AR?'أدخل المبلغ لرؤية الحساب':'Enter an amount to see the numbers'}</p>`:
      `<div class="yrow"><span class="col"><span class="nm">${
        lump?(AR?'الدفعة':'The payment'):(AR?'كل دفعة':'Each payment')}</span>
        <span class="sub">${freqLabel(l)} · ${AR?'تنتهي':'ends'} ${fmtMon(loanEndDate(l))}</span></span>
        <span class="val">${mn(pmt)}</span></div>
      ${(loanEvery(l)>1||lump)?`<div class="yrow"><span class="col"><span class="nm">${
        AR?'خصّص شهرياً':'Set aside monthly'}</span>
        <span class="sub">${AR?`على ${ml} شهراً`:`over ${ml} months`}</span></span>
        <span class="val" style="color:var(--teal)">${mn(acc)}</span></div>`:''}
      <div class="yrow total"><span class="col"><span class="nm">${AR?'الإجمالي':'Total repaid'}</span>
        <span class="sub">${cost>0?(AR?`تكلفة ${mn(cost)} · ${(cost/l.principal*100).toFixed(1)}٪`
          :`${mn(cost)} cost · ${(cost/l.principal*100).toFixed(1)}%`):(AR?'بدون تكلفة':'no extra cost')}</span></span>
        <span class="val">${mn(loanTotal(l))}</span></div>`;
  }
  document.querySelectorAll('[data-pre]').forEach(b=>b.onclick=()=>{
    const q=PRESETS[+b.dataset.pre];
    document.getElementById('lN').value=q.count;
    document.getElementById('lE').value=q.every;
    document.querySelectorAll('[data-pre]').forEach(x=>x.classList.remove('on'));
    b.classList.add('on');preview()});
  document.querySelectorAll('[data-lk]').forEach(b=>b.onclick=()=>setKind(b.dataset.lk));
  ['lP','lN','lE','lS'].forEach(id=>document.getElementById(id).oninput=preview);
  setKind(l.kind);
  document.getElementById('lSave').onclick=()=>{
    const en=document.getElementById('lEn').value.trim();
    if(!en){toast(AR?'أدخل اسماً':'Enter a name');return}
    if(!l.principal){toast(AR?'أدخل المبلغ':'Enter the amount');return}
    l.en=en;l.ar=l.ar||en;
    if(isNew)LOANS.push(l); else LOANS[i]=l;
    save();closeSheet();reflow();toast(AR?'تم الحفظ':'Saved');};
}

/* ---------- budget editor ---------- */
const fullMonths=()=>KEYS.filter(k=>!MONTHS[k].future&&MONTHS[k].elapsed===MONTHS[k].dim);
function avgFor(ci){
  const f=fullMonths();if(!f.length)return null;
  return Math.round(f.reduce((a,k)=>a+MONTHS[k].spend[ci],0)/f.length);
}
function openBudgetEditor(){
  drawBudgetEditor();
  document.getElementById('budov').classList.add('on');
}
function drawBudgetEditor(){
  const onY=BUD==='y',list=onY?FUNDS:CATS,f=fullMonths();
  document.getElementById('budtitle').textContent=onY
    ?(AR?'ضبط الميزانية السنوية':'Set annual budgets')
    :(AR?'ضبط الميزانية الشهرية':'Set monthly budgets');
  const src=f.map(k=>AR?MONTHS[k].sh_ar||MONTHS[k].shAr:MONTHS[k].sh).join(' + ');
  const tot=list.reduce((a,c)=>a+(onY?c.annual:c.b),0);
  const avgTot=onY?null:list.reduce((a,c,i)=>a+(avgFor(i)||0),0);
  document.getElementById('budEditBody').innerHTML=`
  <p style="font-size:11.5px;color:var(--muted);line-height:1.65;margin-bottom:6px">${
    onY?(AR?'الفئات السنوية غير متكررة، لذا لا يوجد متوسط يُقترح. أدخل المبلغ المتوقع للسنة.'
        :'Annual categories are one-offs, so there is no average to suggest. Enter what you expect for the year.')
      :(f.length?(AR?`المتوسط محسوب من الأشهر المكتملة فقط (${src}). أغسطس مستبعد لأنه لم ينتهِ بعد.`
        :`Averages come from complete months only (${src}). August is excluded because it is still running.`)
      :(AR?'لا توجد أشهر مكتملة بعد لحساب متوسط.':'No complete months yet to average from.'))}</p>
  <div class="card" style="margin-top:10px">
  ${list.map((c,i)=>{
    const av=onY?null:avgFor(i);
    return `<div class="erow">
      <span class="tic" style="width:34px;height:34px;border-radius:11px;background:${c.c}1F;color:${c.c}">${svg(c.ic)}</span>
      <span class="col"><span class="nm">${L(c)}</span>
        ${av!==null&&av>0
          ? `<button class="sug" data-use="${i}" data-val="${av}">${AR?'المتوسط':'Average'} ${mn(av)} · <b>${AR?'استخدمه':'use'}</b></button>`
          : `<span class="sug none">${AR?'لا يوجد سجل كافٍ':'No history yet'}</span>`}</span>
      <input class="einput" type="number" inputmode="numeric" data-bud="${i}" value="${onY?c.annual:c.b}">
    </div>`}).join('')}
  <div class="sumline"><span>${AR?'إجمالي الميزانية':'Total budget'}</span><b>${mn(tot)}</b></div>
  ${avgTot?`<div class="sumline" style="border:none;padding-top:0;color:var(--muted)">
    <span>${AR?'متوسط الإنفاق الفعلي':'Actual average spend'}</span><b>${mn(avgTot)}</b></div>`:''}
  </div>
  ${!onY&&f.length?`<button class="primary" id="useAll">${AR?'استخدم المتوسطات لكل الفئات':'Use averages for all'}</button>
  <button class="primary" id="useAll10" style="background:var(--tealLite);color:var(--teal);margin-top:9px">
    ${AR?'المتوسط + 10٪ هامش':'Averages + 10% headroom'}</button>`:''}`;

  document.querySelectorAll('.einput').forEach(inp=>inp.oninput=()=>{
    const v=parseFloat(inp.value);if(v>0){const o=list[+inp.dataset.bud];if(onY)o.annual=Math.round(v);else o.b=Math.round(v);save();syncTotals()}});
  document.querySelectorAll('[data-use]').forEach(b=>b.onclick=()=>{
    const i=+b.dataset.use,v=+b.dataset.val;list[i].b=v;
    document.querySelector(`[data-bud="${i}"]`).value=v;syncTotals();
    toast((AR?'تم ضبط ':'Set ')+L(list[i])+' · '+mn(v));});
  const ua=document.getElementById('useAll');
  if(ua)ua.onclick=()=>applyAll(1);
  const ua10=document.getElementById('useAll10');
  if(ua10)ua10.onclick=()=>applyAll(1.1);
  function applyAll(mult){
    CATS.forEach((c,i)=>{const av=avgFor(i);if(av>0)c.b=Math.round(av*mult/10)*10});save();
    drawBudgetEditor();
    toast(mult>1?(AR?'تم التطبيق مع هامش 10٪':'Applied with 10% headroom')
      :(AR?'تم تطبيق المتوسطات':'Averages applied'));
  }
  function syncTotals(){
    const t=list.reduce((a,c)=>a+(onY?c.annual:c.b),0);
    document.querySelector('.sumline b').textContent=mn(t);
  }
}


/* ---------- persistence ---------- */
const KEY='qfin.v1';
let MEM=null;                      // fallback when storage is blocked (e.g. preview frames)
function rawGet(){try{return localStorage.getItem(KEY)}catch(e){return MEM}}
function rawSet(v){try{localStorage.setItem(KEY,v)}catch(e){MEM=v}}
function snapshot(){
  return {v:2,ar:AR,cur:CUR,profile:PROFILE,
    cats:CATS.map(c=>({en:c.en,ar:c.ar,b:c.b,c:c.c,ic:c.ic,
      items:c.items.map(i=>({en:i.en,ar:i.ar}))})),
    funds:FUNDS.map(f=>({en:f.en,ar:f.ar,annual:f.annual,c:f.c,ic:f.ic,months:f.months,deposits:f.deposits||{}})),
    loans:LOANS,
    months:{...ARCHIVE,...Object.fromEntries(KEYS.map(k=>[k,MONTHS[k].tx]))}};
}
function save(){try{rawSet(JSON.stringify(snapshot()))}catch(e){console.warn('save failed',e)}}
function load(){
  const raw=rawGet();if(!raw)return false;
  let d;try{d=JSON.parse(raw)}catch(e){return false}
  if(!d||!(d.v===1||d.v===2))return false;
  if(d.profile)PROFILE={...PROFILE,...d.profile};
  if(d.v===2&&Array.isArray(d.cats)&&d.cats.length){
    CATS.length=0;
    d.cats.forEach(sc=>CATS.push({en:sc.en,ar:sc.ar||sc.en,b:sc.b,c:sc.c||'#2E8B72',
      ic:sc.ic||'tag',items:(sc.items||[]).map(i=>({en:i.en,ar:i.ar||i.en,w:0}))}));
  } else {
    (d.cats||[]).forEach(sc=>{const c=CATS.find(x=>x.en===sc.en);if(!c)return;
      c.b=sc.b;
      (sc.items||[]).forEach(si=>{if(!c.items.find(x=>x.en===si.en))c.items.push({en:si.en,ar:si.ar,w:0})})});
  }
  if(Array.isArray(d.funds)&&d.funds.length&&d.funds[0].c){
    FUNDS.length=0;
    d.funds.forEach(sf=>FUNDS.push({en:sf.en,ar:sf.ar||sf.en,annual:sf.annual,
      c:sf.c,ic:sf.ic||'tag',months:sf.months||{},deposits:sf.deposits||{}}));
  } else {
    (d.funds||[]).forEach(sf=>{const f=FUNDS.find(x=>x.en===sf.en);if(!f)return;
      f.annual=sf.annual;f.months=sf.months||{}});
  }
  Object.entries(d.months||{}).forEach(([k,tx])=>{
    if(MONTHS[k]){MONTHS[k].tx=tx||[];recompute(MONTHS[k])}
    else ARCHIVE[k]=tx||[];        /* older months: keep them safe rather than discard */
  });
  if(Array.isArray(d.loans))LOANS=d.loans;
  if(typeof d.ar==='boolean')AR=d.ar;
  if(d.cur&&MONTHS[d.cur])CUR=d.cur;
  return true;
}
function exportData(){
  const blob=new Blob([JSON.stringify(snapshot(),null,2)],{type:'application/json'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download=`finance-backup-${new Date().toISOString().slice(0,10)}.json`;
  document.body.appendChild(a);a.click();a.remove();
  rawSet(rawSet.last=JSON.stringify(snapshot()));
  try{localStorage.setItem(KEY+'.lastExport',new Date().toISOString())}catch(e){}
}
function importData(file){
  const r=new FileReader();
  r.onload=()=>{try{rawSet(r.result);location.reload()}
    catch(e){toast(AR?'ملف غير صالح':'Invalid file')}};
  r.readAsText(file);
}
function lastExport(){try{return localStorage.getItem(KEY+'.lastExport')}catch(e){return null}}

let amt='',pickedCat=-1,editIdx=null,pickDay=null,pickAcc=0,txType='e',filterCat=-1;

function flatPickable(){
  const m=Mo(),out=[];
  CATS.forEach((c,ci)=>m.items[ci].forEach(it=>out.push({...it,ci,c:c.c,ic:c.ic})));
  return out.sort((a,b)=>(b.fresh||0)-(a.fresh||0)||b.a-a.a).slice(0,11);
}

function addTexts(){
  document.getElementById('addtitle').textContent=editIdx!==null
    ?(AR?'تعديل المبلغ':'Edit amount'):(AR?'إضافة مصروف':'Add expense');
  document.getElementById('amtc').textContent=AR?'ريال قطري':'QAR';

    :(AR?'اكتب المبلغ ثم اختر البند للحفظ':'Type the amount, then tap an item to save');

function openAdd(tx,idx){

  editIdx=(typeof idx==='number')?idx:null;
  amt=(tx&&tx.a)?String(tx.a):'';
  txType=(tx&&tx.t==='i')?'i':'e';
  filterCat=-1;
  pickDay=(tx&&tx.day)?tx.day:Mo().elapsed;
  pickAcc=(tx&&typeof tx.acc==='number')?tx.acc:0;
  paintAmt();drawPad();drawItems();addTexts();
  document.getElementById('addmain').style.display='';
  document.getElementById('addnew').style.display='none';
  ov().classList.add('on');

function closeAdd(){ov().classList.remove('on');editIdx=null}
function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('on');
  clearTimeout(window._tt);window._tt=setTimeout(()=>t.classList.remove('on'),2200)}
function commit(i){
  const val=parseFloat(amt);
  if(!val||val<=0){toast(AR?'اكتب المبلغ أولاً':'Enter an amount first');return}
  const m=Mo(),pick=window._pick[i];
  if(editIdx!==null)m.tx.splice(editIdx,1);
  const day=pickDay||m.elapsed;
  if(txType==='i')m.tx.unshift({t:'i',en:pick.en,ar:pick.ar,ii:pick.ii,a:val,day,acc:pickAcc});
  else m.tx.unshift({en:pick.en,ar:pick.ar,ci:pick.ci,a:val,day,acc:pickAcc});
  m.tx.sort((a,b)=>b.day-a.day);
  recompute(m);
  const wasEdit=editIdx!==null;save();
  const disp=document.querySelector('.amt-disp');
  disp.classList.add('saved');
  setTimeout(()=>{disp.classList.remove('saved');closeAdd();render();
    toast((wasEdit?(AR?'تم التحديث · ':'Updated · '):(AR?'أُضيف ':'Added '))+mn(val)+' · '+L(pick));},280);
}

  document.querySelector('[data-i="segM"]').textContent=AR?'شهري':'Monthly';
  document.querySelector('[data-i="segY"]').textContent=AR?'سنوي':'Annual';
  document.querySelector('[data-i="segL"]').textContent=AR?'قروض':'Loans';
  document.querySelector('[data-i="nav1"]').lastChild.textContent=AR?'الرئيسية':'Home';
  document.querySelector('[data-i="nav2"]').lastChild.textContent=AR?'التحليلات':'Insights';
  document.querySelector('[data-i="nav3"]').lastChild.textContent=AR?'الميزانيات':'Budgets';
  document.querySelector('[data-i="nav4"]').lastChild.textContent=AR?'الإعدادات':'Settings';
  homeView();insView();budView();setView();
  moveThumb();
  const hb=document.getElementById('heroBig');
  if(hb){const shown=Mo().future?spent():(hasIncome()?netLeft():spent());
    countUp(hb,shown);lastTotal=shown}else{lastTotal=null}
  animateIn();
  requestAnimationFrame(animateCharts);
  ANIM=false;
  if(ov().classList.contains('on')){drawItems();addTexts()}
}
function reflow(){ANIM=true;render()}
document.querySelector('.addb').onclick=()=>openAdd();
document.getElementById('budclose').onclick=()=>{
  document.getElementById('budov').classList.remove('on');reflow();};
document.getElementById('catovclose').onclick=()=>{
  if(catEdit){drawCatManager();return}
  document.getElementById('catov').classList.remove('on');reflow();};
document.getElementById('setupSkip').onclick=closeSetup;
document.addEventListener('click',e=>{
  if(e.target.closest('#editBudgets'))openBudgetEditor();});
document.getElementById('perbtn').onclick=monthSheet;
document.getElementById('lang').onclick=()=>{AR=!AR;save();reflow()};
document.getElementById('scrim').onclick=dismissSheet;
document.getElementById('addclose').onclick=()=>{
  if(document.getElementById('addnew').style.display===''){
    document.getElementById('addnew').style.display='none';
    document.getElementById('addmain').style.display='';
  } else closeAdd();};
document.getElementById('pad').addEventListener('click',e=>{
  const b=e.target.closest('[data-k]');if(!b)return;const k=b.dataset.k;
  if(k==='⌫')amt=amt.slice(0,-1);
  else if(k==='.'){if(!amt.includes('.')&&amt!=='')amt+='.'}
  else{if(amt.includes('.')&&amt.split('.')[1].length>=2)return;
       if(amt.replace('.','').length>=7)return;amt+=k}
  paintAmt();});
document.getElementById('igrid').addEventListener('click',e=>{
  if(e.target.closest('[data-new]')){openNewItem();return}
  const b=e.target.closest('[data-it]');if(b)commit(+b.dataset.it);});
document.getElementById('niname').addEventListener('input',checkNew);
document.getElementById('nicats').addEventListener('click',e=>{
  const b=e.target.closest('[data-cp]');if(!b)return;
  document.querySelectorAll('.cpill').forEach(x=>x.classList.remove('on'));
  b.classList.add('on');pickedCat=+b.dataset.cp;checkNew();});
document.getElementById('nisave').onclick=()=>{
  const nm=document.getElementById('niname').value.trim();
  CATS[pickedCat].items.push({en:nm,ar:nm,w:0,fresh:Date.now()});
  recompute(Mo());save();
  document.getElementById('addnew').style.display='none';
  document.getElementById('addmain').style.display='';
  drawItems();toast((AR?'أُضيف البند · ':'Item added · ')+nm);};
document.getElementById('ttExp').onclick=()=>{txType='e';drawItems()};
document.getElementById('ttInc').onclick=()=>{txType='i';drawItems()};
document.getElementById('chipdate').onclick=dateSheet;
document.getElementById('chipacc').onclick=accSheet;
document.addEventListener('click',e=>{
  const dp=e.target.closest('[data-day]');
  if(dp&&!dp.disabled){
    const nd=+dp.dataset.day;
    if(editingTx!==null){
      const m=Mo(),t=m.tx[editingTx];
      t.day=nd;m.tx.sort((a,b)=>b.day-a.day);recompute(m);save();
      const ni=m.tx.indexOf(t);editingTx=null;closeSheet();render();
      toast((AR?'تم نقل العملية إلى ':'Moved to ')+dayLabel(nd));
      setTimeout(()=>txSheet(ni),320);
    } else {pickDay=nd;closeSheet();addTexts()}
    return}
  const ap=e.target.closest('[data-acc]');
  if(ap){
    const na=+ap.dataset.acc;
    if(editingTx!==null){
      const m=Mo(),t=m.tx[editingTx];t.acc=na;const ni=editingTx;
      editingTx=null;closeSheet();render();
      toast((AR?'تم التغيير إلى ':'Changed to ')+L(ACCOUNTS[na]));
      setTimeout(()=>txSheet(ni),320);
    } else {pickAcc=na;closeSheet();addTexts()}
    return}
  const mo=e.target.closest('[data-mo]');
  if(mo){CUR=mo.dataset.mo;lastTotal=null;save();closeSheet();reflow();return}
  const q=e.target.closest('.qadd');
  if(q){openAdd();return}
  if(e.target.closest('#qmore')){openAdd();return}
  const tx=e.target.closest('[data-tx]');
  if(tx&&canEdit()){txSheet(+tx.dataset.tx);return}
  const jp=e.target.closest('[data-jump]');
  if(jp){CUR=jp.dataset.jump;lastTotal=null;save();reflow();return}
  if(e.target.closest('[data-goup]')){
    const nxt=KEYS.filter(k=>MONTHS[k].future&&MONTHS[k].tx.length).pop();
    if(nxt){CUR=nxt;lastTotal=null;save();reflow()}return}
  if(e.target.closest('[data-gom]')){document.querySelector('[data-b="m"]').click();return}
  if(e.target.closest('[data-goy]')){
    document.querySelector('[data-b="y"]').click();return}
  if(e.target.closest('[data-gol]')){document.querySelector('[data-b="l"]').click();return}
  const ln=e.target.closest('[data-loan]');if(ln){loanSheet(+ln.dataset.loan);return}
  const fd=e.target.closest('[data-fund]');if(fd){fundSheet(+fd.dataset.fund);return}
  const c=e.target.closest('[data-cat]');if(c)catSheet(+c.dataset.cat);});
document.querySelectorAll('.ni').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('.ni').forEach(x=>x.classList.remove('on'));
  document.querySelectorAll('.view').forEach(x=>x.classList.remove('on'));
  b.classList.add('on');document.getElementById(b.dataset.v).classList.add('on');
  window.scrollTo(0,0);reflow();});
/* scope to the Budgets control only — '.seg button' also matched the Expense/Income toggle */
document.querySelectorAll('#v-bud [data-b]').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('#v-bud [data-b]').forEach(x=>x.classList.remove('on'));
  b.classList.add('on');BUD=b.dataset.b;reflow();});
const had=load();
render();
if(!PROFILE.setup&&!PROFILE.name)setTimeout(openSetup,400);

</script>
</body>
